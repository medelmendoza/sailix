openapi: 3.1.0
info:
  title: Sailix Platform API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Source of truth for /api/v1 (ADR-0006). Phase B covers authentication, `/me`, tenant administration
    core and platform administration. Business modules are added in Phase D.
    Tenant context is never an input: it is derived from the credential (docs/02 §6).
servers:
  - url: /api/v1
tags:
  - { name: auth, description: 'Login, logout, token rotation and invitations' }
  - { name: me, description: 'The authenticated principal' }
  - { name: announcements, description: "The caller's organization announcements" }
  - { name: tenant, description: "Tenant administration (caller's own tenant only)" }
  - { name: modules, description: 'Module gateways (Tala, read-only in the MVP)' }
  - { name: platform, description: 'Superadmin platform administration' }
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: loginToken
      summary: Mobile login. Returns a token bound to one membership, or a selection ticket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                device_name: { type: string, maxLength: 120 }
                agency_code: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: Token issued, or tenant selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TokenGrant'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutToken
      summary: Revoke the current token.
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/token/select:
    post:
      tags: [auth]
      operationId: selectToken
      summary: Complete mobile login after organization selection
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the token (old one is revoked). Refused after the absolute session limit.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/token/switch:
    post:
      tags: [auth]
      operationId: switchToken
      summary: Switch to another of the user's own active memberships (new token; old revoked).
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        '200':
          description: New token bound to the target membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/session:
    post:
      tags: [auth]
      operationId: loginSession
      summary: Web tenant-admin cookie login (call GET /sanctum/csrf-cookie first).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                agency_code: { type: [string, 'null'] }
      responses:
        '200':
          description: Session started, or membership selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SessionStarted'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutSession
      summary: Web logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session/select:
    post:
      tags: [auth]
      operationId: selectSession
      summary: Select session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionStarted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [auth]
      operationId: registerCrew
      summary: Self-register into an organization (pending admin activation)
      description: >
        Creates the account and a `pending` membership with role `crew` in the organization identified by
        `agency_code`. Role, status and tenant cannot be supplied. No token is issued; the member cannot sign in
        until a tenant admin activates the membership. The response is identical whether or not the email already
        has an account (an existing account is told by email instead; no enumeration of emails). An unknown or
        inactive agency code and an already-used username are reported as validation errors (accepted trade-off).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency_code, username, email, password, password_confirmation, first_name, last_name]
              properties:
                agency_code: { type: string, maxLength: 32 }
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                password_confirmation: { type: string }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: [string, 'null'], maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                suffix: { type: [string, 'null'], maxLength: 20 }
                mobile: { type: [string, 'null'], pattern: '^\+?[0-9 ()-]{7,20}$' }
      responses:
        '202':
          description: Registration received (identical for new and already-registered emails).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link by email
      description: Always answers 202, whether or not an active account exists for the email. The link is single-use and expires in 60 minutes. Tala passwords are never involved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes every token and session of the user. Invalid, expired, used or foreign tokens all answer `422 invalid_reset_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Account activated. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Authenticated user, membership, tenant, abilities and feature flags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: Requires the current password. Revokes all OTHER tokens and sessions of the user; the current one stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/deletion-request:
    post:
      tags: [me]
      operationId: requestAccountDeletion
      summary: Ask the organization to delete the caller's account
      description: >
        Records one open request per membership (repeating returns the same request) and notifies the organization's
        administrators. Deletion semantics and retention are pending decision Q-3: nothing is deleted or anonymized
        by this call and the member keeps access until an administrator acts.
      responses:
        '202':
          description: Request recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/feedback:
    post:
      tags: [me]
      operationId: sendFeedback
      summary: Send feedback about the Sailix app to the caller's organization
      description: >
        Stored for the organization's administrators. The organization and member come from the authenticated
        context. It is not sent to any service (such as Tala). Limited to 10 per day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: { type: string, enum: [bug, idea, other] }
                message: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Feedback' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /announcements:
    get:
      tags: [announcements]
      operationId: listAnnouncements
      summary: Announcements of the caller's organization, newest first
      description: >
        Shows only announcements that are switched on and not past their end date. `is_read` is the caller's own read
        state. `unread_count` counts every unread visible announcement, not only this page.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberAnnouncementPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /announcements/{announcementId}:
    get:
      tags: [announcements]
      operationId: getAnnouncement
      summary: One announcement (404 when it is not visible to the caller)
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The announcement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /announcements/{announcementId}/read:
    put:
      tags: [announcements]
      operationId: markAnnouncementRead
      summary: Mark an announcement as read by the caller (idempotent)
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The announcement with `is_read` true.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/announcements:
    get:
      tags: [tenant]
      operationId: listTenantAnnouncements
      summary: Every announcement of the caller's organization, including switched-off and expired ones
      description: Requires `announcements.manage`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenant]
      operationId: createAnnouncement
      summary: Write an announcement for the caller's organization
      description: >
        Requires `announcements.manage`. Every active member of the organization can read it. The organization and author
        come from the session. Attachments are not supported yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/announcements/{announcementId}:
    patch:
      tags: [tenant]
      operationId: updateAnnouncement
      summary: Edit, switch off or re-date an announcement
      description: Requires `announcements.manage`.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: deleteAnnouncement
      summary: Delete an announcement (and its read records)
      description: Requires `announcements.manage`.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: Get tenant
      description: Requires ability `tenant.view`.
      responses:
        '200':
          description: Own tenant and resolved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateTenantSettings
      summary: Update tenant settings
      description: Requires ability `tenant.manage`. Unknown keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/users:
    get:
      tags: [tenant]
      operationId: listTenantUsers
      summary: List tenant users
      description: Requires `users.view`. Only the caller's tenant is ever returned.
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string } }
        - { name: 'filter[role]', in: query, schema: { type: string } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/users/{membership}:
    patch:
      tags: [tenant]
      operationId: updateTenantUser
      summary: Update tenant user
      description: Requires `users.manage`. A membership of another tenant answers 404.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [tenant_admin, crew] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/audit-logs:
    get:
      tags: [tenant]
      operationId: listTenantAuditLogs
      summary: List tenant audit logs
      description: Requires `audit.view`.
      parameters:
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries of the caller's tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/deletion-requests:
    get:
      tags: [tenant]
      operationId: listDeletionRequests
      summary: List pending account-deletion requests of the caller's organization
      description: Requires `users.manage`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of deletion requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequestPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/feedback:
    get:
      tags: [tenant]
      operationId: listFeedback
      summary: List feedback sent by members of the caller's organization
      description: Requires `users.manage`. Newest first.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of feedback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules:
    get:
      tags: [tenant]
      operationId: listTenantModules
      summary: List modules and this organization's entitlement state
      description: Requires `tenant.view`. Lists every module in the registry.
      responses:
        '200':
          description: Module states for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules/{module}:
    put:
      tags: [tenant]
      operationId: setTenantModuleEnabled
      summary: Enable or disable a module for the caller's organization
      description: >
        Requires `module.<code>.manage`. Only toggles use of a module the platform has already
        provisioned (entitlement + team mapping). The team mapping can NOT be changed here. Disabling
        takes effect on the next gateway request.
      parameters:
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated module state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /modules/tala/link:
    get:
      tags: [modules]
      operationId: getTalaLink
      summary: State of the caller's Tala link
      description: >
        Requires the Tala module to be provisioned and enabled for the organization and `module.tala.use`.
        Never returns tokens, the Tala user id, team id or any credential.
      responses:
        '200':
          description: Link state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [modules]
      operationId: linkTalaAccount
      summary: Link the caller's existing Tala account
      description: >
        Verifies the credentials with Tala over HTTPS, requires the organization's mapped Tala team to be among the
        account's teams, then stores ONLY encrypted tokens (the password is never stored or logged). One Tala account
        can belong to one Sailix user; an account cannot be created here. Throttled.
        Error codes: `link_failed`, `team_not_in_organization`, `external_account_taken`, `different_account_linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [modules]
      operationId: unlinkTalaAccount
      summary: Remove the caller's Tala link and its stored tokens
      responses:
        '204': { description: Unlinked (idempotent). }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses:
    get:
      tags: [modules]
      operationId: listTalaCourses
      summary: The caller's assigned Tala courses (read-only)
      description: >
        The Tala user and team are taken from the stored link, never from the request. `409 not_linked` /
        `409 relink_required` when the link is missing or Tala rejected the stored token; `503 module_unavailable`
        when Tala cannot be reached. Material kinds excluded from the MVP (EPUB, legacy quizzes) are omitted.
      responses:
        '200':
          description: Courses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TalaCourse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/join:
    post:
      tags: [modules]
      operationId: joinTalaCourse
      summary: Apply to join a Tala course by its code (write)
      description: >
        Disabled by default together with the other Tala writes (`403 feature_disabled`). The Tala user and team come
        from the stored link; the client sends only the code. Tala usually creates an application that an administrator
        approves, so success means "requested", not "enrolled". A code Tala does not accept is `422 course_code_rejected`
        (one message, no detail). The code is never logged or audited. Limited to 10 per hour. Tala's real answers to this
        call are UNVERIFIED (needs a course code from the owner).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '202':
          description: Application sent to Tala.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [requested] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}:
    get:
      tags: [modules]
      operationId: getTalaCourse
      summary: One assigned course with its materials and stored progress (read-only)
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Course detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaCourseDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/progress:
    post:
      tags: [modules]
      operationId: submitTalaProgress
      summary: Mark the caller's own video/PDF materials of a course as completed in Tala (write)
      description: >
        Disabled by default (`403 feature_disabled`; see `progress_submission` on the course). The payload sent to Tala is
        built on the server from Tala's own stored snapshot of this user; the client only names material ids. No score,
        comment or free text is accepted or forwarded. Completion never goes backwards. Quizzes are refused
        (`422 unsupported_material`). `409 progress_busy` when another update for the same link is running.
        Server-side replace/merge semantics of Tala's sync are UNVERIFIED (docs/13 section 20).
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
                feedback:
                  type: [object, 'null']
                  description: >
                    Optional video feedback keyed by the id of a VIDEO in `completed` (star rating 1 to 5 in half steps, comment
                    up to 1000 characters; an empty comment is stored as "N/A", as the Tala app does). `422 invalid_feedback`
                    for anything else.
                  additionalProperties:
                    type: object
                    required: [rating]
                    additionalProperties: false
                    properties:
                      rating: { type: number, minimum: 1, maximum: 5, multipleOf: 0.5 }
                      comment: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaProgressResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/quizzes/{quizId}:
    get:
      tags: [modules]
      operationId: getTalaQuiz
      summary: The questions of one quiz of the caller's course (never the answers)
      description: >
        Requires `progress_submission` (`403 feature_disabled` otherwise): quizzes are scored on the server, which needs
        the write path. The answer key Tala ships with the quiz is kept on the server and never returned.
        `422 unsupported_quiz` when the quiz uses a format the server cannot score with certainty.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: quizId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Quiz.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaQuiz' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/quizzes/{quizId}/attempts:
    post:
      tags: [modules]
      operationId: submitTalaQuizAttempt
      summary: Submit answers; the SERVER scores them and records the result in Tala
      description: >
        The client sends answers only (never a score, result or status). The server fetches Tala's quiz, scores with
        Tala's rules, replaces the stored attempt (retakes allowed, 10 per hour per quiz) and returns totals only.
        `409 quiz_changed` if the quiz was updated since it was loaded; `422 incomplete_answers` / `invalid_answers`.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: quizId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                version: { type: [string, 'null'], maxLength: 32, description: 'The `version` of the quiz as loaded' }
                answers:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [ref, value]
                    additionalProperties: false
                    properties:
                      ref: { type: string, pattern: '^[0-9]{1,3}\.[0-9]{1,3}$' }
                      value:
                        description: 'single: the option index as a string; multiple: an array of option indexes; text: the typed answer'
                        oneOf:
                          - { type: string, maxLength: 1000 }
                          - { type: array, items: { type: string, maxLength: 2 } }
      responses:
        '200':
          description: Scored and recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaQuizResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/flashcards/{cardId}:
    get:
      tags: [modules]
      operationId: getTalaFlashcards
      summary: The cards of one flashcard set of the caller's course, with ratings Tala already holds
      description: >
        Requires `progress_submission` (`403 feature_disabled` otherwise). Only https media addresses are returned.
        `422 unsupported_deck` for a set the server cannot represent. Ratings of an earlier session are returned per
        card when the set is unchanged.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: cardId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Deck.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaDeck' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/flashcards/{cardId}/ratings:
    post:
      tags: [modules]
      operationId: submitTalaFlashcardRatings
      summary: Record a COMPLETE set of ratings (every card rated) for a flashcard set (write)
      description: >
        Like the Tala app, a set is recorded only when every card has been rated. The row Tala stores is built on the
        server from Tala's own deck (no card text from the client). `422 incomplete_ratings` / `invalid_ratings`,
        `409 deck_changed` when the set changed since it was loaded. A later submission replaces the stored result.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: cardId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratings]
              properties:
                version: { type: [string, 'null'], maxLength: 32 }
                ratings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [index, rating]
                    additionalProperties: false
                    properties:
                      index: { type: integer, minimum: 0, maximum: 499 }
                      rating: { type: string, enum: [easy, medium, hard] }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaFlashcardResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/materials/{materialId}:
    get:
