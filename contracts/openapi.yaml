openapi: 3.1.0
info:
  title: Sailix Platform API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Source of truth for /api/v1 (ADR-0006). Phase B covers authentication, `/me`, tenant administration
    core and platform administration. Business modules are added in Phase D.
    Tenant context is never an input: it is derived from the credential (docs/02 §6).
servers:
  - url: /api/v1
tags:
  - { name: auth, description: 'Login, logout, token rotation and invitations' }
  - { name: me, description: 'The authenticated principal' }
  - { name: announcements, description: "The caller's organization announcements" }
  - { name: callit, description: "Call-it: the caller's own incident / safety reports" }
  - { name: documents, description: "The caller's own documents (Files)" }
  - { name: finance, description: "The caller's own payslips and cash advances" }
  - { name: todos, description: "The caller's own to-dos" }
  - { name: tenant, description: "Tenant administration (caller's own tenant only)" }
  - { name: modules, description: 'Module gateways (Tala, read-only in the MVP)' }
  - { name: platform, description: 'Superadmin platform administration' }
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: loginToken
      summary: Mobile login. Returns a token bound to one membership, or a selection ticket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                device_name: { type: string, maxLength: 120 }
                agency_code: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: Token issued, or tenant selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TokenGrant'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutToken
      summary: Revoke the current token.
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/token/select:
    post:
      tags: [auth]
      operationId: selectToken
      summary: Complete mobile login after organization selection
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the token (old one is revoked). Refused after the absolute session limit.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/token/switch:
    post:
      tags: [auth]
      operationId: switchToken
      summary: Switch to another of the user's own active memberships (new token; old revoked).
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        '200':
          description: New token bound to the target membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/session:
    post:
      tags: [auth]
      operationId: loginSession
      summary: Web tenant-admin cookie login (call GET /sanctum/csrf-cookie first).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                agency_code: { type: [string, 'null'] }
      responses:
        '200':
          description: Session started, or membership selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SessionStarted'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutSession
      summary: Web logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session/select:
    post:
      tags: [auth]
      operationId: selectSession
      summary: Select session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionStarted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [auth]
      operationId: registerCrew
      summary: Self-register into an organization (pending admin activation)
      description: >
        Creates the account and a `pending` membership with role `crew` in the organization identified by
        `agency_code`. Role, status and tenant cannot be supplied. No token is issued; the member cannot sign in
        until a tenant admin activates the membership. The response is identical whether or not the email already
        has an account (an existing account is told by email instead; no enumeration of emails). An unknown or
        inactive agency code and an already-used username are reported as validation errors (accepted trade-off).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency_code, username, email, password, password_confirmation, first_name, last_name]
              properties:
                agency_code: { type: string, maxLength: 32 }
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                password_confirmation: { type: string }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: [string, 'null'], maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                suffix: { type: [string, 'null'], maxLength: 20 }
                mobile: { type: [string, 'null'], pattern: '^\+?[0-9 ()-]{7,20}$' }
      responses:
        '202':
          description: Registration received (identical for new and already-registered emails).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link by email
      description: Always answers 202, whether or not an active account exists for the email. The link is single-use and expires in 60 minutes. Tala passwords are never involved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes every token and session of the user. Invalid, expired, used or foreign tokens all answer `422 invalid_reset_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Account activated. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Authenticated user, membership, tenant, abilities and feature flags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: Requires the current password. Revokes all OTHER tokens and sessions of the user; the current one stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/deletion-request:
    post:
      tags: [me]
      operationId: requestAccountDeletion
      summary: Ask the organization to delete the caller's account
      description: >
        Records one open request per membership (repeating returns the same request) and notifies the organization's
        administrators. Deletion semantics and retention are pending decision Q-3: nothing is deleted or anonymized
        by this call and the member keeps access until an administrator acts.
      responses:
        '202':
          description: Request recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/feedback:
    post:
      tags: [me]
      operationId: sendFeedback
      summary: Send feedback about the Sailix app to the caller's organization
      description: >
        Stored for the organization's administrators. The organization and member come from the authenticated
        context. It is not sent to any service (such as Tala). Limited to 10 per day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: { type: string, enum: [bug, idea, other] }
                message: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Feedback' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public/tenant:
    get:
      tags: [tenant]
      operationId: getPublicTenant
      summary: The look of the organization the request's address names
      description: >
        No sign-in. The organization comes from the host (its default address or a verified custom domain), or from
        `X-Tenant-Host` when the web portal and the API are on different hosts, or from `X-Tenant-Slug` where shared-address
        demos are switched on. `404 tenant_not_found` when the address names none (the shared sign-in page);
        `403 tenant_unavailable` when the organization is switched off. Carries only its name and look, never ids or people.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTenantEnvelope' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /public/tenants/{slug}/logo:
    get:
      tags: [tenant]
      operationId: getPublicTenantLogo
      summary: An organization's logo (public image)
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /public/tenants/{slug}/favicon:
    get:
      tags: [tenant]
      operationId: getPublicTenantFavicon
      summary: An organization's favicon (public image)
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /public/tenants/{slug}/login-logo:
    get:
      tags: [tenant]
      operationId: getPublicTenantLoginLogo
      summary: An organization's sign-in logo (public image)
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /public/tenants/{slug}/login-background:
    get:
      tags: [tenant]
      operationId: getPublicTenantLoginBackground
      summary: An organization's sign-in background picture (public image)
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /announcements:
    get:
      tags: [announcements]
      operationId: listAnnouncements
      summary: Announcements of the caller's organization, newest first
      description: >
        Shows only announcements that are switched on and not past their end date. `is_read` is the caller's own read
        state. `unread_count` counts every unread visible announcement, not only this page.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberAnnouncementPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /announcements/{announcementId}:
    get:
      tags: [announcements]
      operationId: getAnnouncement
      summary: One announcement (404 when it is not visible to the caller)
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The announcement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /announcements/{announcementId}/file:
    get:
      tags: [announcements]
      operationId: getAnnouncementFile
      summary: Open the file attached to an announcement
      description: >
        Only for a member the announcement is addressed to (everyone, or their fleet); anyone else, and an announcement
        without a file, answers 404. The file is PDF, JPEG or PNG; show it, never run it.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /announcements/{announcementId}/read:
    put:
      tags: [announcements]
      operationId: markAnnouncementRead
      summary: Mark an announcement as read by the caller (idempotent)
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The announcement with `is_read` true.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/announcements:
    get:
      tags: [tenant]
      operationId: listTenantAnnouncements
      summary: Every announcement of the caller's organization, including switched-off and expired ones
      description: Requires `announcements.manage`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenant]
      operationId: createAnnouncement
      summary: Write an announcement for the caller's organization
      description: >
        Requires `announcements.manage`. Every active member of the organization can read it. The organization and author
        come from the session. Attachments are not supported yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/announcements/{announcementId}:
    patch:
      tags: [tenant]
      operationId: updateAnnouncement
      summary: Edit, switch off or re-date an announcement
      description: Requires `announcements.manage`.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: deleteAnnouncement
      summary: Delete an announcement (and its read records)
      description: Requires `announcements.manage`.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/announcements/{announcementId}/attachment:
    post:
      tags: [tenant]
      operationId: setAnnouncementAttachment
      summary: Attach a file to an announcement (replaces any earlier one)
      description: >
        Requires `announcements.manage`. PDF, JPEG or PNG, judged by the file's content; the size limit is the
        organization's upload limit. The earlier file, if any, is deleted.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The announcement with its attachment.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: removeAnnouncementAttachment
      summary: Remove the attached file
      description: Requires `announcements.manage`. Answers 204 whether or not there was a file.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/announcements/{announcementId}/file:
    get:
      tags: [tenant]
      operationId: getTenantAnnouncementFile
      summary: Open the file attached to an announcement (administrators)
      description: Requires `announcements.manage`.
      parameters:
        - { $ref: '#/components/parameters/AnnouncementId' }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /todos:
    get:
      tags: [todos]
      operationId: listMyTodos
      summary: The caller's own to-dos (open first, soonest due first)
      description: >
        Only tasks assigned to the caller's membership. `open_count` and `overdue_count` cover every task of the caller,
        not only this page.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, done] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of to-dos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTodoPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /todos/{todoId}:
    patch:
      tags: [todos]
      operationId: setMyTodoDone
      summary: Tick or untick one of the caller's own to-dos (idempotent)
      description: Nothing else about the task can be changed by its assignee. Someone else's task is `404`.
      parameters:
        - { $ref: '#/components/parameters/TodoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_done]
              properties:
                is_done: { type: boolean }
      responses:
        '200':
          description: The updated to-do.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/todos:
    get:
      tags: [tenant]
      operationId: listTenantTodos
      summary: Every to-do of the caller's organization
      description: Requires `todos.manage`. Optionally filtered by status or by one assignee.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, done] } }
        - { name: membership_id, in: query, schema: { type: string } }
        - { name: 'filter[name]', in: query, description: 'The owner''s first or last name (or both, as typed) or username contains this.', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of to-dos with their assignee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenant]
      operationId: createTodos
      summary: Assign a to-do to one or more members (one task is created per member)
      description: >
        Requires `todos.manage`. Every chosen member must be an ACTIVE member of the caller's organization, otherwise
        nothing is created (`422 invalid_assignee`). The organization and author come from the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, membership_ids]
              properties:
                description: { type: string, minLength: 1, maxLength: 500 }
                due_date: { type: [string, 'null'], format: date }
                membership_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
      responses:
        '201':
          description: The created to-dos, one per member.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/todos/{todoId}:
    patch:
      tags: [tenant]
      operationId: updateTodo
      summary: Change a to-do's text or due date
      description: 'Requires `todos.manage`. The assignee cannot be changed; delete the task and assign a new one.'
      parameters:
        - { $ref: '#/components/parameters/TodoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, minLength: 1, maxLength: 500 }
                due_date: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: deleteTodo
      summary: Delete a to-do
      description: Requires `todos.manage`.
      parameters:
        - { $ref: '#/components/parameters/TodoId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /document-types:
    get:
      tags: [documents]
      operationId: listDocumentTypes
      summary: The document types of the caller's organization (active ones)
      responses:
        '200':
          description: Types.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /document-requests:
    get:
      tags: [documents]
      operationId: listMyDocumentRequests
      summary: Documents the agency asked me to submit or renew
      description: >
        The kinds of document an administrator asked the signed-in member for, not yet answered. A request closes when the
        member submits a document of that kind. Only the caller's own requests are ever returned.
      responses:
        '200':
          description: Open requests, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentRequestItem' }
        '401': { $ref: '#/components/responses/Problem' }
  /documents:
    get:
      tags: [documents]
      operationId: listMyDocuments
      summary: The caller's own documents
      description: >
        `status` is approved (default), pending, rejected or review (waiting or sent back). `expiry_status` and `counts` are
        computed on the server: a document is expiring within 90 days of its expiry date.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [approved, pending, rejected, review] } }
      responses:
        '200':
          description: Documents, soonest-expiring first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDocumentList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [documents]
      operationId: submitDocument
      summary: Submit a new document for the agency to approve
      description: >
        Multipart. The owner, organization and status come from the session (the document starts as `pending`). The file
        must be a PDF, JPEG or PNG judged by its content, within the organization's `upload_max_mb`. Limited to 30 per hour.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '201':
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CrewDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getMyDocument
      summary: One of the caller's own documents
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CrewDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /documents/{documentId}/file:
    get:
      tags: [documents]
      operationId: getMyDocumentFile
      summary: The stored file of one of the caller's own documents
      description: Streams the PDF or image with `nosniff` and no caching. Someone else's document is `404`.
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /documents/{documentId}/resubmit:
    post:
      tags: [documents]
      operationId: resubmitDocument
      summary: Correct and send again a document that is waiting or was sent back
      description: 'Multipart; send only what changes (a new file replaces the old one). An approved document is `409 document_approved`.'
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '200':
          description: Back to `pending`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CrewDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /finance/status:
    get:
      tags: [finance]
      operationId: getFinanceStatus
      summary: Whether the payslips are unlocked for this sign-in
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FinanceStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/unlock:
    post:
      tags: [finance]
      operationId: unlockFinance
      summary: Re-enter the password to open the payslips for a few minutes
      description: >
        Replaces the old client-side birthdate gate with a server-enforced step-up. The unlock belongs to this sign-in only.
        A wrong password is `422 invalid_password` (audited, never with the password); limited to 5 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Unlocked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FinanceStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /payslips:
    get:
      tags: [finance]
      operationId: listMyPayslips
      summary: The caller's own payslips, newest first (needs the step-up when the organization requires it)
      description: '`kind` is allotment (regular and special together, the default), final, regular or special. Held payslips are never listed. `403 step_up_required` when locked.'
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [allotment, final, regular, special] } }
      responses:
        '200':
          description: Payslip summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PayslipSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /payslips/{payslipId}:
    get:
      tags: [finance]
      operationId: getMyPayslip
      summary: One of the caller's own payslips with its deductions
      description: >
        Every amount is the server's own value (never recompute it). The bank account number is masked to its last four
        digits. Someone else's payslip is `404`. `403 step_up_required` when locked.
      parameters:
        - { $ref: '#/components/parameters/PayslipId' }
      responses:
        '200':
          description: The payslip.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PayslipDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /loans:
    get:
      tags: [finance]
      operationId: listMyLoans
      summary: The caller's own cash advances with totals per currency
      description: Not behind the step-up. `totals` is what is still being deducted each period (running loans only), per currency.
      responses:
        '200':
          description: Cash advances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/document-types:
    get:
      tags: [tenant]
      operationId: listTenantDocumentTypes
      summary: All document types of the caller's organization (including switched-off ones)
      description: Requires `documents.manage`.
      responses:
        '200':
          description: Types.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenant]
      operationId: createDocumentType
      summary: Add a document type
      description: Requires `documents.manage`. Names are unique per organization (`409 document_type_exists`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DocumentType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/document-types/{documentTypeId}:
    patch:
      tags: [tenant]
      operationId: updateDocumentType
      summary: Rename or switch a document type on or off
      description: Requires `documents.manage`.
      parameters:
        - { $ref: '#/components/parameters/DocumentTypeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DocumentType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: deleteDocumentType
      summary: Delete a document type nobody uses
      description: 'Requires `documents.manage`. A type that documents refer to is `409 document_type_in_use`; switch it off instead.'
      parameters:
        - { $ref: '#/components/parameters/DocumentTypeId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/documents:
    get:
      tags: [tenant]
      operationId: listTenantDocuments
      summary: The documents members of the organization submitted (oldest first, for review)
      description: Requires `documents.manage`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: membership_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of documents with their owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewDocumentPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/documents/{documentId}/file:
    get:
      tags: [tenant]
      operationId: getTenantDocumentFile
      summary: The stored file of a document in the caller's organization
      description: Requires `documents.manage`.
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/documents/{documentId}/approve:
    post:
      tags: [tenant]
      operationId: approveDocument
      summary: Approve a pending document
      description: Requires `documents.manage`. Only a pending document (`409 not_pending`).
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CrewDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/documents/{documentId}/reject:
    post:
      tags: [tenant]
      operationId: rejectDocument
      summary: Send a pending document back with a reason
      description: Requires `documents.manage`. The member sees the reason and may resubmit. Only a pending document (`409 not_pending`).
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CrewDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /callit/stats:
    get:
      tags: [callit]
      operationId: getCallItStats
      summary: How many reports the caller has made, and the milestones reached
      description: Only for organizations that have the Call-it module switched on (`403 module_disabled` otherwise).
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItStats' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /callit/reports:
    get:
      tags: [callit]
      operationId: listMyCallItReports
      summary: The caller's own reports (drafts included), most recently changed first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, reviewed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of reports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallItReportPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [callit]
      operationId: createCallItReport
      summary: 'Save a draft report, or send a complete one (with submit true)'
      description: >
        A draft may be half written. With `submit: true` the report must be complete (classification, sub-classification,
        location, vessel, details; the other-location text when the location is `others`; the intervention text when
        `intervened`), otherwise `422`. The reporter, organization and status come from the session. Limited to 60 per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallItReportInput' }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /callit/reports/{reportId}:
    get:
      tags: [callit]
      operationId: getMyCallItReport
      summary: One of the caller's own reports
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [callit]
      operationId: updateMyCallItReport
      summary: Change a draft, and optionally send it
      description: 'Only a draft (`409 report_not_draft` after it was sent). Send only what changes; submit true checks the whole draft.'
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallItReportInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [callit]
      operationId: deleteMyCallItDraft
      summary: Delete a draft (and its file)
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /callit/reports/{reportId}/file:
    get:
      tags: [callit]
      operationId: getMyCallItFile
      summary: The attached file of one of the caller's own reports
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: The file (PDF, JPEG or PNG), with `nosniff` and no caching.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [callit]
      operationId: attachCallItFile
      summary: Attach (or replace) one file on a draft
      description: Multipart. PDF, JPEG or PNG judged by content, within the organization's `upload_max_mb`. Only a draft.
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [callit]
      operationId: detachCallItFile
      summary: Remove the attached file from a draft
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/callit/reports:
    get:
      tags: [tenant]
      operationId: listTenantCallItReports
      summary: The reports members of the organization sent (not drafts), unreviewed first
      description: Requires `callit.manage`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, reviewed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of reports with their reporter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallItReportPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/callit/reports/{reportId}/file:
    get:
      tags: [tenant]
      operationId: getTenantCallItFile
      summary: The attached file of a sent report in the caller's organization
      description: Requires `callit.manage`. A draft is `404`.
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/callit/reports/{reportId}/review:
    post:
      tags: [tenant]
      operationId: reviewCallItReport
      summary: Mark a sent report as reviewed
      description: Requires `callit.manage`. Only a submitted report (`409 not_submitted`); a draft is `404`.
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: Reviewed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallItReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/finance/imports/{kind}/template:
    get:
      tags: [tenant]
      operationId: getFinanceImportTemplate
      summary: A CSV template (the header and one example row) for the payslip or loan import
      description: Requires `finance.manage`.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [payslips, loans] } }
      responses:
        '200':
          description: The CSV.
          content:
            text/csv: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/finance/imports/{kind}:
    post:
      tags: [tenant]
      operationId: importFinanceCsv
      summary: Check, or load, a CSV of payslips or cash advances for the caller's own members
      description: >
        Requires `finance.manage`. Multipart. The members are named by `username` and must belong to the caller's organization.
        The file is checked as a WHOLE: with `commit` false (the default) nothing is written and the answer says what would
        happen; with `commit` true it is loaded only if every row is valid (all or nothing). Re-loading the same file updates
        the same records (a payslip is its member, kind, pay date and period label; a loan is its member and code). Amounts are
        stored exactly as given. At most 2000 rows and 2 MB. Limited to 30 per hour. The audit trail records counts only.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [payslips, loans] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'A .csv or .txt file.' }
                commit: { type: boolean, default: false }
      responses:
        '200':
          description: The result of the check or the load.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FinanceImportResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: Get tenant
      description: Requires ability `tenant.view`.
      responses:
        '200':
          description: Own tenant and resolved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateTenantSettings
      summary: Update tenant settings
      description: Requires ability `tenant.manage`. Unknown keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/users:
    get:
      tags: [tenant]
      operationId: listTenantUsers
      summary: List tenant users
      description: Requires `users.view`. Only the caller's tenant is ever returned.
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string } }
        - { name: 'filter[role]', in: query, schema: { type: string } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/users/{membership}:
    patch:
      tags: [tenant]
      operationId: updateTenantUser
      summary: Update tenant user
      description: Requires `users.manage`. A membership of another tenant answers 404.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [tenant_admin, crew] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/crew:
    get:
      tags: [tenant]
      operationId: listCrew
      summary: List the organization's crew
      description: >
        Requires `users.view`. Members with the crew role only (administrators are managed under users), sorted by last
        then first name. The search filters are partial, case-insensitive matches; `%` and `_` are plain text. The
        birthday is not part of the list.
      parameters:
        - { name: 'filter[last_name]', in: query, schema: { type: string } }
        - { name: 'filter[first_name]', in: query, schema: { type: string } }
        - { name: 'filter[crew_number]', in: query, schema: { type: string } }
        - { name: 'filter[name]', in: query, description: 'One box for who: matches the first or last name, or both as typed, or the username.', schema: { type: string } }
        - { name: 'filter[status]', in: query, description: 'An unknown value is ignored.', schema: { type: string, enum: [pending, active, suspended] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of crew.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/crew/fleets:
    get:
      tags: [tenant]
      operationId: listCrewFleets
      summary: The fleets in use among the crew
      description: Requires `users.view`. For choosing who an announcement is for.
      responses:
        '200':
          description: Fleet names, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/crew/{membership}:
    get:
      tags: [tenant]
      operationId: getCrew
      summary: One crew member, with the birthday
      description: Requires `users.view`. A member of another organization, or an administrator, answers 404.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The crew member.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Crew' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateCrew
      summary: Edit a crew member's record
      description: >
        Requires `users.manage`. Only the fields below are accepted; an empty string clears an optional field. The crew
        number is unique within the organization (`422` when taken). The audit trail records which fields changed, never
        their values.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewUpdate' }
      responses:
        '200':
          description: The updated crew member.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Crew' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/crew/{membership}/documents:
    get:
      tags: [tenant]
      operationId: listCrewDocuments
      summary: One row per kind of document, with what this member has on file
      description: >
        Requires `documents.manage`. Every active document type of the organization, in name order. `state` is computed on
        the server: `missing` (nothing submitted), `pending` (waiting for review), `rejected` (sent back), or for an approved
        document `none` (no expiry date), `valid`, `expiring` (within 90 days) or `expired`. When a member has several approved
        documents of a kind, the one that stays valid longest counts. `requested` tells whether the agency has asked this member
        for that kind and they have not answered yet.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CrewDocumentRow' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/crew/{membership}/document-requests/{documentType}:
    put:
      tags: [tenant]
      operationId: requestCrewDocument
      summary: Ask the member to submit or renew a kind of document
      description: >
        Requires `documents.manage`. Idempotent: asking again for a kind already asked for answers 200. `409 not_active` unless
        the member is active. The request closes by itself when the member submits a document of that kind.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
        - { name: documentType, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Already requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewDocumentRequested' }
        '201':
          description: Requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewDocumentRequested' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: withdrawCrewDocumentRequest
      summary: Take the request back
      description: Requires `documents.manage`. Answers 204 whether or not there was an open request.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
        - { name: documentType, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Withdrawn. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/crew/{membership}/password-reset:
    post:
      tags: [tenant]
      operationId: sendCrewPasswordReset
      summary: Email the member a password reset link
      description: >
        Requires `users.manage`. Sends the normal reset-by-email link to the member's address. The administrator never sees
        or sets a password. `409 not_active` unless the member is active; `429` when a link was just sent.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: The link was sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [sent] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /tenant/branding:
    get:
      tags: [tenant]
      operationId: getTenantBranding
      summary: The organization's branding
      description: Requires `tenant.manage`. The organization is the session's, never a parameter.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateTenantBranding
      summary: Set the tagline and colours
      description: >
        Requires `tenant.manage`. Colours are `#RRGGBB` and must be dark enough for white button text (contrast of at least
        4.5:1 against white). An empty value clears a field (platform default). Text is plain: no markup. The audit trail
        names the fields changed, never their values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingInput' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/branding/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, favicon, login-logo, login-background] } }
    post:
      tags: [tenant]
      operationId: setTenantBrandingImage
      summary: Upload the logo or the favicon
      description: >
        Requires `tenant.manage`. A JPEG or PNG judged by its content (no SVG), at most 5 MB. It is shrunk (logo 512 px,
        favicon 128 px) and re-encoded, which also drops metadata. The earlier image is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tenant]
      operationId: removeTenantBrandingImage
      summary: Remove the logo or the favicon
      description: Requires `tenant.manage`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/domains:
    get:
      tags: [tenant]
      operationId: listTenantDomains
      summary: The default address and the custom domains
      description: Requires `tenant.manage`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenant]
      operationId: addTenantDomain
      summary: Add a custom domain (unverified)
      description: >
        Requires `tenant.manage`. The name is normalized (lowercase, no port, no leading `www`). It routes nothing until it
        is verified. `422 invalid_domain`, `422 reserved_domain` (under the Sailix domain), `409 domain_taken` (verified by
        another organization), `409 domain_exists`, `409 too_many_domains` (10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 253 }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/domains/{domainId}/verify:
    post:
      tags: [tenant]
      operationId: verifyTenantDomain
      summary: Check the DNS record and start routing the domain
      description: >
        Requires `tenant.manage`. The organization publishes a TXT record named `txt_name` with the value `txt_value`; this
        looks it up. `422 verification_failed` until it is found. Other organizations' unverified claims on the domain are
        dropped; a domain already verified by another organization is `409 domain_taken`.
      parameters:
        - { name: domainId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant/domains/{domainId}:
    delete:
      tags: [tenant]
      operationId: removeTenantDomain
      summary: Remove a domain
      description: Requires `tenant.manage`.
      parameters:
        - { name: domainId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tenant/audit-logs:
    get:
      tags: [tenant]
      operationId: listTenantAuditLogs
      summary: List tenant audit logs
      description: Requires `audit.view`.
      parameters:
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries of the caller's tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/dashboard:
    get:
      tags: [tenant]
      operationId: getDashboard
      summary: Everything the admin dashboard shows, in one answer
      description: >-
        The crew figure and first page of waiting applications, the first page of documents waiting for review, the first
        page of announcements and the number of open deletion requests. Each part is what the ordinary list returns (five
        rows). A part the caller may not see, or whose feature is switched off for the organization, is left out.
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/deletion-requests:
    get:
      tags: [tenant]
      operationId: listDeletionRequests
      summary: List pending account-deletion requests of the caller's organization
      description: Requires `users.manage`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of deletion requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequestPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/feedback:
    get:
      tags: [tenant]
      operationId: listFeedback
      summary: List feedback sent by members of the caller's organization
      description: Requires `users.manage`. Newest first.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of feedback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules:
    get:
      tags: [tenant]
      operationId: listTenantModules
      summary: List modules and this organization's entitlement state
      description: Requires `tenant.view`. Lists every module in the registry.
      responses:
        '200':
          description: Module states for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules/{module}:
    put:
      tags: [tenant]
      operationId: setTenantModuleEnabled
      summary: Enable or disable a module for the caller's organization
      description: >
        Requires `module.<code>.manage`. Only toggles use of a module the platform has already
        provisioned (entitlement + team mapping). The team mapping can NOT be changed here. Disabling
        takes effect on the next gateway request.
      parameters:
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated module state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /modules/tala/link:
    get:
      tags: [modules]
      operationId: getTalaLink
      summary: State of the caller's Tala link
      description: >
        Requires the Tala module to be provisioned and enabled for the organization and `module.tala.use`.
        Never returns tokens, the Tala user id, team id or any credential.
      responses:
        '200':
          description: Link state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [modules]
      operationId: linkTalaAccount
      summary: Link the caller's existing Tala account
      description: >
        Verifies the credentials with Tala over HTTPS, requires the organization's mapped Tala team to be among the
        account's teams, then stores ONLY encrypted tokens (the password is never stored or logged). One Tala account
        can belong to one Sailix user; an account cannot be created here. Throttled.
        Error codes: `link_failed`, `team_not_in_organization`, `external_account_taken`, `different_account_linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [modules]
      operationId: unlinkTalaAccount
      summary: Remove the caller's Tala link and its stored tokens
      responses:
        '204': { description: Unlinked (idempotent). }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses:
    get:
      tags: [modules]
      operationId: listTalaCourses
      summary: The caller's assigned Tala courses (read-only)
      description: >
        The Tala user and team are taken from the stored link, never from the request. `409 not_linked` /
        `409 relink_required` when the link is missing or Tala rejected the stored token; `503 module_unavailable`
        when Tala cannot be reached. Material kinds excluded from the MVP (EPUB, legacy quizzes) are omitted.
      responses:
        '200':
          description: Courses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TalaCourse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/join:
    post:
      tags: [modules]
      operationId: joinTalaCourse
      summary: Apply to join a Tala course by its code (write)
      description: >
        Disabled by default together with the other Tala writes (`403 feature_disabled`). The Tala user and team come
        from the stored link; the client sends only the code. Tala usually creates an application that an administrator
        approves, so success means "requested", not "enrolled". A code Tala does not accept is `422 course_code_rejected`
        (one message, no detail). The code is never logged or audited. Limited to 10 per hour. Tala's real answers to this
        call are UNVERIFIED (needs a course code from the owner).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '202':
          description: Application sent to Tala.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [requested] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}:
    get:
      tags: [modules]
      operationId: getTalaCourse
      summary: One assigned course with its materials and stored progress (read-only)
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Course detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaCourseDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/progress:
    post:
      tags: [modules]
      operationId: submitTalaProgress
      summary: Mark the caller's own video/PDF materials of a course as completed in Tala (write)
      description: >
        Disabled by default (`403 feature_disabled`; see `progress_submission` on the course). The payload sent to Tala is
        built on the server from Tala's own stored snapshot of this user; the client only names material ids. No score,
        comment or free text is accepted or forwarded. Completion never goes backwards. Quizzes are refused
        (`422 unsupported_material`). `409 progress_busy` when another update for the same link is running.
        Server-side replace/merge semantics of Tala's sync are UNVERIFIED (docs/13 section 20).
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
                feedback:
                  type: [object, 'null']
                  description: >
                    Optional video feedback keyed by the id of a VIDEO in `completed` (star rating 1 to 5 in half steps, comment
                    up to 1000 characters; an empty comment is stored as "N/A", as the Tala app does). `422 invalid_feedback`
                    for anything else.
                  additionalProperties:
                    type: object
                    required: [rating]
                    additionalProperties: false
                    properties:
                      rating: { type: number, minimum: 1, maximum: 5, multipleOf: 0.5 }
                      comment: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaProgressResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/quizzes/{quizId}:
    get:
      tags: [modules]
      operationId: getTalaQuiz
      summary: The questions of one quiz of the caller's course (never the answers)
      description: >
        Requires `progress_submission` (`403 feature_disabled` otherwise): quizzes are scored on the server, which needs
        the write path. The answer key Tala ships with the quiz is kept on the server and never returned.
        `422 unsupported_quiz` when the quiz uses a format the server cannot score with certainty.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: quizId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Quiz.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaQuiz' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/quizzes/{quizId}/attempts:
    post:
      tags: [modules]
      operationId: submitTalaQuizAttempt
      summary: Submit answers; the SERVER scores them and records the result in Tala
      description: >
        The client sends answers only (never a score, result or status). The server fetches Tala's quiz, scores with
        Tala's rules, replaces the stored attempt (retakes allowed, 10 per hour per quiz) and returns totals only.
        `409 quiz_changed` if the quiz was updated since it was loaded; `422 incomplete_answers` / `invalid_answers`.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: quizId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                version: { type: [string, 'null'], maxLength: 32, description: 'The `version` of the quiz as loaded' }
                answers:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [ref, value]
                    additionalProperties: false
                    properties:
                      ref: { type: string, pattern: '^[0-9]{1,3}\.[0-9]{1,3}$' }
                      value:
                        description: 'single: the option index as a string; multiple: an array of option indexes; text: the typed answer'
                        oneOf:
                          - { type: string, maxLength: 1000 }
                          - { type: array, items: { type: string, maxLength: 2 } }
      responses:
        '200':
          description: Scored and recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaQuizResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/flashcards/{cardId}:
    get:
      tags: [modules]
      operationId: getTalaFlashcards
      summary: The cards of one flashcard set of the caller's course, with ratings Tala already holds
      description: >
        Requires `progress_submission` (`403 feature_disabled` otherwise). Only https media addresses are returned.
        `422 unsupported_deck` for a set the server cannot represent. Ratings of an earlier session are returned per
        card when the set is unchanged.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: cardId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Deck.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaDeck' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/flashcards/{cardId}/ratings:
    post:
      tags: [modules]
      operationId: submitTalaFlashcardRatings
      summary: Record a COMPLETE set of ratings (every card rated) for a flashcard set (write)
      description: >
        Like the Tala app, a set is recorded only when every card has been rated. The row Tala stores is built on the
        server from Tala's own deck (no card text from the client). `422 incomplete_ratings` / `invalid_ratings`,
        `409 deck_changed` when the set changed since it was loaded. A later submission replaces the stored result.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: cardId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratings]
              properties:
                version: { type: [string, 'null'], maxLength: 32 }
                ratings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [index, rating]
                    additionalProperties: false
                    properties:
                      index: { type: integer, minimum: 0, maximum: 499 }
                      rating: { type: string, enum: [easy, medium, hard] }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaFlashcardResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/materials/{materialId}:
    get:
      tags: [modules]
      operationId: getTalaMaterial
      summary: Metadata and file address of one video or PDF material of the caller's course
      description: >
        Quiz materials are never delivered (their payload contains the answer key; D-T8): `422 unsupported_material`.
        The material must belong to the caller's own course; the address is returned only when it is https.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: materialId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Material.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaMaterial' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /platform/auth/options:
    get:
      tags: [platform]
      operationId: getPlatformLoginOptions
      summary: Whether superadmin sign-in asks for a one-time code here.
      description: >
        Always `true` except on a development machine whose environment switches it off. Carries nothing secret, so the
        sign-in page can ask before showing its form.
      security: []
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [otp_required]
                    properties:
                      otp_required: { type: boolean }
        '429': { $ref: '#/components/responses/Problem' }
  /platform/auth/session:
    post:
      tags: [platform]
      operationId: loginPlatform
      summary: Superadmin login with a TOTP (mandatory except on a development machine that switches it off).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Required unless `otp_required` is false (see the options endpoint).
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [platform]
      operationId: logoutPlatform
      summary: Logout platform
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/me:
    get:
      tags: [platform]
      operationId: getPlatformMe
      summary: Get platform me
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The signed-in superadmin.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdminWithAbilities' }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: List tenants
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [provisioning, active, suspended, deactivated, archived] } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: createTenant
      summary: Create tenant
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{2,32}$' }
                name: { type: string, maxLength: 255 }
                slug:
                  type: string
                  description: >
                    The organization's default address (`<slug>.<base domain>`): 3 to 40 lowercase letters, digits or single
                    hyphens, unique, not reserved (www, api, platform...). Optional: it starts as the agency code. Fixed once created.
      responses:
        '201':
          description: Tenant created in `provisioning`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: getTenantById
      summary: Get tenant by id
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updateTenantName
      summary: Update tenant name
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/{action}:
    post:
      tags: [platform]
      operationId: transitionTenant
      summary: Lifecycle transition. Reason required for suspend, deactivate, archive. Revokes access when leaving `active`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, suspend, reactivate, deactivate, archive] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Tenant after the transition.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/admins:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listTenantAdmins
      summary: List tenant admins
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Page of tenant administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: inviteTenantAdmin
      summary: Invite tenant admin
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                username: { type: [string, 'null'], maxLength: 64 }
                display_name: { type: [string, 'null'], maxLength: 120 }
      responses:
        '201':
          description: Invitation created and emailed. `meta.invitation_token` is returned only in local/testing environments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
                  meta:
                    type: object
                    properties:
                      invitation_token: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/branding:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: getPlatformTenantBranding
      summary: An organization's branding
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformTenantBranding
      summary: Set an organization's tagline and colours
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingInput' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/branding/reset:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    post:
      tags: [platform]
      operationId: resetPlatformTenantBranding
      summary: Back to the platform look
      description: Removes the branding and its images. Nothing else about the organization changes.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/branding/{kind}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, favicon, login-logo, login-background] } }
    post:
      tags: [platform]
      operationId: setPlatformTenantBrandingImage
      summary: Upload an organization's logo or favicon
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [platform]
      operationId: removePlatformTenantBrandingImage
      summary: Remove an organization's logo or favicon
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/domains:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listPlatformTenantDomains
      summary: An organization's default address and custom domains
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainList' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: addPlatformTenantDomain
      summary: Add a custom domain for an organization (unverified)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 253 }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/domains/{domainId}/verify:
    post:
      tags: [platform]
      operationId: verifyPlatformTenantDomain
      summary: Check the DNS record and start routing the domain
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: domainId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/domains/{domainId}:
    delete:
      tags: [platform]
      operationId: removePlatformTenantDomain
      summary: Remove a domain
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: domainId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listPlatformTenantModules
      summary: List module entitlements of a tenant
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Module states of the tenant, including link counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules/{module}:
    put:
      tags: [platform]
      operationId: provisionTenantModule
      summary: Grant a module to a tenant and map it to the external team
      description: >
        Platform-only. `external_team_id` binds the organization to exactly one team of the external
        system; it must be unique across all organizations. It cannot change while links exist
        (409 `links_exist`). A team already mapped to another organization is refused
        (409 `team_already_mapped`).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_team_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: 'Required for a module that talks to an upstream system (Tala); not accepted for a built-in one (Astra).' }
                enabled: { type: boolean, default: false }
      responses:
        '200':
          description: Provisioned module.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/features:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listPlatformTenantFeatures
      summary: Core features of an organization and whether each is on
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Every core feature, on by default.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantFeature' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformTenantFeatures
      summary: Switch core features on or off for an organization
      description: >
        Features not named keep their state. A feature that is off is hidden in the web portal and the mobile app and
        refused by the API for that organization (403 `feature_disabled`).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [features]
              properties:
                features:
                  type: object
                  description: Feature code to on (true) or off (false).
                  additionalProperties: { type: boolean }
      responses:
        '200':
          description: The features after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantFeature' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/settings:
    get:
      tags: [platform]
      operationId: getPlatformSettings
      description: >
        Includes `tala_api_base_url` (platform-only; never tenant-configurable): an `https://` origin whose
        host is on the deployment allow-list (`SAILIX_TALA_ALLOWED_HOSTS`) and resolves only to public addresses.
      summary: Get platform settings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Platform settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformSettings
      summary: Update platform settings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/audit-logs:
    get:
      tags: [platform]
      operationId: listPlatformAuditLogs
      summary: List platform audit logs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[tenant_id]', in: query, schema: { type: string } }
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries (all tenants + platform).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile token bound to a membership (docs/04).
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA cookie session (web). Mutations require X-XSRF-TOKEN. Cookie name is configurable (SESSION_COOKIE).
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
    DocumentTypeId:
      name: documentTypeId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
    PayslipId:
      name: payslipId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
    TodoId:
      name: todoId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
  responses:
    Problem:
      description: RFC 9457 problem. `code` is a stable machine-readable identifier.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >
            unauthenticated, forbidden, not_found, validation, throttled, csrf_mismatch, invalid_credentials,
            invalid_ticket, invalid_invitation, invalid_transition, no_active_admin, last_admin, already_member,
            account_suspended, tenant_suspended, membership_suspended, membership_pending, web_access_denied,
            no_access, mfa_not_enrolled, tenant_mismatch, tenant_context_missing, invalid_agency_code, invalid_reset_token, invalid_current_password, module_disabled,
            module_forbidden, module_unavailable, module_not_provisioned, links_exist, team_already_mapped, server_error
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: [string, 'null'] }
    TenantRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        look:
          description: >
            How the organization looks (the same fields as the public look). Present on the signed-in organization of `/me`, so
            clients with no address of their own (the mobile app) can draw themselves with its colours and logo.
          allOf:
            - { $ref: '#/components/schemas/PublicTenant' }
    MembershipSummary:
      type: object
      required: [id, role, tenant]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        tenant:
          type: object
          required: [code, name]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
    TokenGrant:
      type: object
      required: [token, expires_at, membership]
      properties:
        token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        membership: { $ref: '#/components/schemas/MembershipSummary' }
    SelectionRequired:
      type: object
      required: [requires_tenant_selection, ticket, memberships]
      properties:
        requires_tenant_selection: { const: true }
        ticket: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    SessionStarted:
      type: object
      required: [membership, tenant]
      properties:
        membership:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string }
        tenant:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
    Me:
      type: object
      required: [user, membership, tenant, abilities, modules, memberships]
      properties:
        user:
          type: object
          required: [id, username, email]
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string }
            role: { type: string, enum: [tenant_admin, crew] }
            status: { type: string }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        abilities:
          type: array
          items: { type: string }
        modules:
          description: Modules this organization is entitled to AND this role may use, with the caller's link state.
          type: array
          items: { $ref: '#/components/schemas/MyModule' }
        feature_access:
          description: >-
            Core features switched on (true) or off (false) for this organization by the platform. Clients hide what is
            off; the API refuses it (403 `feature_disabled`).
          type: object
          additionalProperties: { type: boolean }
        memberships:
          description: >-
            Every organization the authenticated user can currently sign in to (active membership in an active
            organization), derived server-side from the credential. Used to offer organization switching via
            POST /auth/token/switch, which re-validates the choice.
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/MembershipSummary' }
              - type: object
                required: [current]
                properties:
                  current: { type: boolean }
    PlatformTenantFeature:
      type: object
      required: [code, label, description, enabled]
      properties:
        code: { type: string, enum: [crew, documents, announcements, finance, feedback, todos, branding] }
        label: { type: string }
        description: { type: string }
        enabled: { type: boolean }
    Profile:
      type: object
      description: Personal data held per organization (tenant-owned). Date of birth is deliberately not collected.
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        middle_name: { type: [string, 'null'] }
        last_name: { type: string }
        suffix: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
    DeletionRequest:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending] }
        requested_at: { type: string, format: date-time }
        membership:
          type: object
          properties:
            id: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                email: { type: string }
            profile:
              oneOf:
                - { $ref: '#/components/schemas/Profile' }
                - { type: 'null' }
    Dashboard:
      type: object
      description: 'The `links` inside the embedded pages are not meaningful here; use `meta` only.'
      required: [data]
      properties:
        data:
          type: object
          properties:
            crew:
              type: object
              required: [total, pending]
              properties:
                total: { type: integer }
                pending: { $ref: '#/components/schemas/CrewPage' }
            documents:
              type: object
              required: [pending]
              properties:
                pending: { $ref: '#/components/schemas/CrewDocumentPage' }
            announcements:
              type: object
              required: [latest]
              properties:
                latest: { $ref: '#/components/schemas/AnnouncementPage' }
            deletion_requests:
              type: object
              required: [open]
              properties:
                open: { type: integer }
    DeletionRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DeletionRequest' }
    FinanceImportResult:
      type: object
      required: [rows, created, updated, errors, imported]
      properties:
        rows: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0, description: 'New records (or that would be new, in a check).' }
        updated: { type: integer, minimum: 0 }
        errors:
          type: array
          description: At most 50. Line 1 is the header. Any error means nothing was loaded.
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer }
              message: { type: string }
