            overdue_count: { type: integer, minimum: 0 }
    Announcement:
      type: object
      required: [id, title, body, is_active, expires_at, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string, description: 'Plain text; show it as text, never as HTML.' }
        is_active: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_read: { type: boolean, description: "Present on the member's own views only." }
        attachment:
          description: The attached file, if any. Open it with the file endpoint.
          oneOf:
            - type: object
              required: [name, type, size]
              properties:
                name: { type: string }
                type: { type: string }
                size: { type: integer }
            - { type: 'null' }
        fleets:
          type: array
          items: { type: string }
          description: "The fleets it is addressed to; empty means everyone. Present on the administrators' list only."
        author:
          description: "Who wrote it. Present on the administrators' list only."
          oneOf:
            - type: object
              required: [name]
              properties:
                name: { type: string }
            - { type: 'null' }
    AnnouncementInput:
      type: object
      description: All fields are required when creating; send only what changes when editing.
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        is_active: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time, description: 'Must be in the future.' }
        fleets:
          type: [array, 'null']
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 100 }
          description: >
            Who it is for. Leave out, or send an empty list, for everyone; otherwise only members whose crew record names
            one of these fleets (not case-sensitive). On an edit, leaving it out keeps the audience as it is.
    AnnouncementPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Announcement' }
    MemberAnnouncementPage:
      allOf:
        - $ref: '#/components/schemas/AnnouncementPage'
        - type: object
          required: [unread_count]
          properties:
            unread_count: { type: integer, minimum: 0 }
    Feedback:
      type: object
      required: [id, category, message, created_at]
      properties:
        id: { type: string }
        category: { type: string, enum: [bug, idea, other] }
        message: { type: string }
        created_at: { type: string, format: date-time }
        membership:
          type: object
          properties:
            id: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                email: { type: string }
    FeedbackPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Feedback' }
    ModuleCode:
      type: string
      enum: [tala, astra, callit]
      description: Module registry. Only `tala` exists in the MVP; new modules are added here.
    TalaLink:
      type: object
      required: [status, linked_at, last_verified_at]
      properties:
        status: { type: string, enum: [not_linked, linked, needs_relink, revoked] }
        linked_at: { type: [string, 'null'], format: date-time }
        last_verified_at: { type: [string, 'null'], format: date-time }
    TalaCourse:
      type: object
      required: [id, name, description, thumbnail_url, creator, date_from, date_to, status, progress, completed, total, percent, state, total_materials]
      properties:
        id: { type: string, description: 'Assignment id (the only id the client ever uses)' }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'], description: 'https address of the course picture' }
        creator: { type: [string, 'null'], description: 'Who made the course, as Tala records it' }
        date_from: { type: [string, 'null'], format: date }
        date_to: { type: [string, 'null'], format: date, description: 'Due date, YYYY-MM-DD' }
        status: { type: [string, 'null'], description: 'As reported by Tala (e.g. INACTIVE, NOT YET COMPLETED, COMPLETED)' }
        progress: { type: [string, 'null'], description: "Tala's own counter, 'done/total' (null for a course never started)" }
        completed: { type: integer, minimum: 0, description: "Materials completed, from Tala's counter (0 when never started)" }
        total: { type: integer, minimum: 0, description: "Materials in the course, from Tala's counter; includes kinds this app does not show" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        state: { type: string, enum: [not_started, in_progress, completed] }
        total_materials: { type: integer, description: 'Materials this app shows' }
    TalaCourseDetail:
      allOf:
        - { $ref: '#/components/schemas/TalaCourse' }
        - type: object
          required: [materials, hidden_materials, progress_submission]
          properties:
            progress_submission:
              type: boolean
              description: Whether this deployment lets the app submit completion to Tala.
            sequential:
              type: boolean
              description: >
                Tala marks the course as ordered: each material is meant to be done after the ones before it, in the
                order listed. Informational for the app, which keeps later materials locked until the earlier ones are
                completed.
            materials:
              type: array
              items: { $ref: '#/components/schemas/TalaMaterialSummary' }
            hidden_materials:
              type: integer
              description: Materials of kinds not supported in the MVP (EPUB, legacy quiz, unknown) that were left out.
    TalaProgressResult:
      type: object
      required: [progress, status, completed]
      properties:
        progress: { type: string, description: 'completed/total as stored after the submission' }
        status: { type: string }
        completed: { type: array, items: { type: string } }
    TalaQuiz:
      type: object
      required: [id, name, description, version, sections]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [id, title, description, questions]
            properties:
              id: { type: string }
              title: { type: [string, 'null'] }
              description: { type: [string, 'null'] }
              questions:
                type: array
                items:
                  type: object
                  required: [ref, type, text, choices, required, media_type, media_url]
                  properties:
                    ref: { type: string }
                    type: { type: string, enum: [single, multiple, text] }
                    text: { type: string }
                    choices: { type: array, items: { type: string } }
                    required: { type: boolean }
                    media_type: { type: [string, 'null'] }
                    media_url: { type: [string, 'null'] }
    TalaQuizResult:
      type: object
      required: [progress, status, correct, wrong, total, average, passed]
      properties:
        progress: { type: string }
        status: { type: string }
        correct: { type: integer }
        wrong: { type: integer }
        total: { type: integer }
        average: { type: number }
        passed: { type: boolean }
    TalaDeck:
      type: object
      required: [id, name, description, version, cards]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: string }
        cards:
          type: array
          items:
            type: object
            required: [index, question, question_media, answer, answer_media, rating]
            properties:
              index: { type: integer }
              question: { type: [string, 'null'] }
              question_media: { $ref: '#/components/schemas/TalaMedia' }
              answer: { type: [string, 'null'] }
              answer_media: { $ref: '#/components/schemas/TalaMedia' }
              rating: { type: [string, 'null'], enum: [easy, medium, hard, null] }
    TalaMedia:
      oneOf:
        - { type: 'null' }
        - type: object
          required: [type, url]
          properties:
            type: { type: string, enum: [image, video, audio] }
            url: { type: string, description: 'https address provided by Tala' }
    TalaFlashcardResult:
      type: object
      required: [progress, status, easy, medium, hard]
      properties:
        progress: { type: string }
        status: { type: string }
        easy: { type: integer }
        medium: { type: integer }
        hard: { type: integer }
    TalaMaterialSummary:
      type: object
      required: [id, type, name, description, thumbnail_url, viewable, progress, status, stats]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf, quiz, flashcards] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        viewable: { type: boolean, description: 'false for quizzes and flashcards unless the write path is enabled' }
        progress: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        stats:
          description: "What the learner achieved, from Tala's stored row (read-only). Shape depends on `type`: video {rating}, quiz {correct, wrong, average, remarks}, flashcards {easy, medium, hard, notseen}; null when nothing is stored."
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                rating: { type: [number, 'null'] }
                correct: { type: integer }
                wrong: { type: integer }
                average: { type: [number, 'null'] }
                remarks: { type: [string, 'null'], enum: [PASSED, FAILED, null] }
                easy: { type: integer }
                medium: { type: integer }
                hard: { type: integer }
                notseen: { type: integer }
    TalaMaterial:
      type: object
      required: [id, type, name, description, thumbnail_url, file_url]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        file_url: { type: [string, 'null'], description: 'https address provided by Tala; access control of the file host is not verified' }
