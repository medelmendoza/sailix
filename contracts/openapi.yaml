                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules/{module}:
    put:
      tags: [platform]
      operationId: provisionTenantModule
      summary: Grant a module to a tenant and map it to the external team
      description: >
        Platform-only. `external_team_id` binds the organization to exactly one team of the external
        system; it must be unique across all organizations. It cannot change while links exist
        (409 `links_exist`). A team already mapped to another organization is refused
        (409 `team_already_mapped`).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_team_id]
              properties:
                external_team_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                enabled: { type: boolean, default: false }
      responses:
        '200':
          description: Provisioned module.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/settings:
    get:
      tags: [platform]
      operationId: getPlatformSettings
      description: >
        Includes `tala_api_base_url` (platform-only; never tenant-configurable): an `https://` origin whose
        host is on the deployment allow-list (`SAILIX_TALA_ALLOWED_HOSTS`) and resolves only to public addresses.
      summary: Get platform settings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Platform settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformSettings
      summary: Update platform settings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/audit-logs:
    get:
      tags: [platform]
      operationId: listPlatformAuditLogs
      summary: List platform audit logs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[tenant_id]', in: query, schema: { type: string } }
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries (all tenants + platform).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile token bound to a membership (docs/04).
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA cookie session (web). Mutations require X-XSRF-TOKEN. Cookie name is configurable (SESSION_COOKIE).
  parameters:
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F-]+$' }
  responses:
    Problem:
      description: RFC 9457 problem. `code` is a stable machine-readable identifier.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >
            unauthenticated, forbidden, not_found, validation, throttled, csrf_mismatch, invalid_credentials,
            invalid_ticket, invalid_invitation, invalid_transition, no_active_admin, last_admin, already_member,
            account_suspended, tenant_suspended, membership_suspended, membership_pending, web_access_denied,
            no_access, mfa_not_enrolled, tenant_mismatch, tenant_context_missing, invalid_agency_code, invalid_reset_token, invalid_current_password, module_disabled,
            module_forbidden, module_unavailable, module_not_provisioned, links_exist, team_already_mapped, server_error
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: [string, 'null'] }
    TenantRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    MembershipSummary:
      type: object
      required: [id, role, tenant]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        tenant:
          type: object
          required: [code, name]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
    TokenGrant:
      type: object
      required: [token, expires_at, membership]
      properties:
        token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        membership: { $ref: '#/components/schemas/MembershipSummary' }
    SelectionRequired:
      type: object
      required: [requires_tenant_selection, ticket, memberships]
      properties:
        requires_tenant_selection: { const: true }
        ticket: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    SessionStarted:
      type: object
      required: [membership, tenant]
      properties:
        membership:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string }
        tenant:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
    Me:
      type: object
      required: [user, membership, tenant, abilities, modules, memberships]
      properties:
        user:
          type: object
          required: [id, username, email]
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string }
            role: { type: string, enum: [tenant_admin, crew] }
            status: { type: string }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        abilities:
          type: array
          items: { type: string }
        modules:
          description: Modules this organization is entitled to AND this role may use, with the caller's link state.
          type: array
          items: { $ref: '#/components/schemas/MyModule' }
        memberships:
          description: >-
            Every organization the authenticated user can currently sign in to (active membership in an active
            organization), derived server-side from the credential. Used to offer organization switching via
            POST /auth/token/switch, which re-validates the choice.
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/MembershipSummary' }
              - type: object
                required: [current]
                properties:
                  current: { type: boolean }
    Profile:
      type: object
      description: Personal data held per organization (tenant-owned). Date of birth is deliberately not collected.
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        middle_name: { type: [string, 'null'] }
        last_name: { type: string }
        suffix: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
    DeletionRequest:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending] }
        requested_at: { type: string, format: date-time }
        membership:
          type: object
          properties:
            id: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                email: { type: string }
            profile:
              oneOf:
                - { $ref: '#/components/schemas/Profile' }
                - { type: 'null' }
    DeletionRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DeletionRequest' }
    Announcement:
      type: object
      required: [id, title, body, is_active, expires_at, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string, description: 'Plain text; show it as text, never as HTML.' }
        is_active: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_read: { type: boolean, description: "Present on the member's own views only." }
    AnnouncementInput:
      type: object
      description: All fields are required when creating; send only what changes when editing.
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        is_active: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time, description: 'Must be in the future.' }
    AnnouncementPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Announcement' }
    MemberAnnouncementPage:
      allOf:
        - $ref: '#/components/schemas/AnnouncementPage'
        - type: object
          required: [unread_count]
          properties:
            unread_count: { type: integer, minimum: 0 }
    Feedback:
      type: object
      required: [id, category, message, created_at]
      properties:
        id: { type: string }
        category: { type: string, enum: [bug, idea, other] }
        message: { type: string }
        created_at: { type: string, format: date-time }
        membership:
          type: object
          properties:
            id: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                email: { type: string }
    FeedbackPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Feedback' }
    ModuleCode:
      type: string
      enum: [tala]
      description: Module registry. Only `tala` exists in the MVP; new modules are added here.
    TalaLink:
      type: object
      required: [status, linked_at, last_verified_at]
      properties:
        status: { type: string, enum: [not_linked, linked, needs_relink, revoked] }
        linked_at: { type: [string, 'null'], format: date-time }
        last_verified_at: { type: [string, 'null'], format: date-time }
    TalaCourse:
      type: object
      required: [id, name, description, thumbnail_url, creator, date_from, date_to, status, progress, completed, total, percent, state, total_materials]
      properties:
        id: { type: string, description: 'Assignment id (the only id the client ever uses)' }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'], description: 'https address of the course picture' }
        creator: { type: [string, 'null'], description: 'Who made the course, as Tala records it' }
        date_from: { type: [string, 'null'], format: date }
        date_to: { type: [string, 'null'], format: date, description: 'Due date, YYYY-MM-DD' }
        status: { type: [string, 'null'], description: 'As reported by Tala (e.g. INACTIVE, NOT YET COMPLETED, COMPLETED)' }
        progress: { type: [string, 'null'], description: "Tala's own counter, 'done/total' (null for a course never started)" }
        completed: { type: integer, minimum: 0, description: "Materials completed, from Tala's counter (0 when never started)" }
        total: { type: integer, minimum: 0, description: "Materials in the course, from Tala's counter; includes kinds this app does not show" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        state: { type: string, enum: [not_started, in_progress, completed] }
        total_materials: { type: integer, description: 'Materials this app shows' }
    TalaCourseDetail:
      allOf:
        - { $ref: '#/components/schemas/TalaCourse' }
        - type: object
          required: [materials, hidden_materials, progress_submission]
          properties:
            progress_submission:
              type: boolean
              description: Whether this deployment lets the app submit completion to Tala.
            materials:
              type: array
              items: { $ref: '#/components/schemas/TalaMaterialSummary' }
            hidden_materials:
              type: integer
              description: Materials of kinds not supported in the MVP (EPUB, legacy quiz, unknown) that were left out.
    TalaProgressResult:
      type: object
      required: [progress, status, completed]
      properties:
        progress: { type: string, description: 'completed/total as stored after the submission' }
        status: { type: string }
        completed: { type: array, items: { type: string } }
    TalaQuiz:
      type: object
      required: [id, name, description, version, sections]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [id, title, description, questions]
            properties:
              id: { type: string }
              title: { type: [string, 'null'] }
              description: { type: [string, 'null'] }
              questions:
                type: array
                items:
                  type: object
                  required: [ref, type, text, choices, required, media_type, media_url]
                  properties:
                    ref: { type: string }
                    type: { type: string, enum: [single, multiple, text] }
                    text: { type: string }
                    choices: { type: array, items: { type: string } }
                    required: { type: boolean }
                    media_type: { type: [string, 'null'] }
                    media_url: { type: [string, 'null'] }
    TalaQuizResult:
      type: object
      required: [progress, status, correct, wrong, total, average, passed]
      properties:
        progress: { type: string }
        status: { type: string }
        correct: { type: integer }
        wrong: { type: integer }
        total: { type: integer }
        average: { type: number }
        passed: { type: boolean }
    TalaDeck:
      type: object
      required: [id, name, description, version, cards]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: string }
        cards:
          type: array
          items:
            type: object
            required: [index, question, question_media, answer, answer_media, rating]
            properties:
              index: { type: integer }
              question: { type: [string, 'null'] }
              question_media: { $ref: '#/components/schemas/TalaMedia' }
              answer: { type: [string, 'null'] }
              answer_media: { $ref: '#/components/schemas/TalaMedia' }
              rating: { type: [string, 'null'], enum: [easy, medium, hard, null] }
    TalaMedia:
      oneOf:
        - { type: 'null' }
        - type: object
          required: [type, url]
          properties:
            type: { type: string, enum: [image, video, audio] }
            url: { type: string, description: 'https address provided by Tala' }
    TalaFlashcardResult:
      type: object
      required: [progress, status, easy, medium, hard]
      properties:
        progress: { type: string }
        status: { type: string }
        easy: { type: integer }
        medium: { type: integer }
        hard: { type: integer }
    TalaMaterialSummary:
      type: object
      required: [id, type, name, description, thumbnail_url, viewable, progress, status, stats]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf, quiz, flashcards] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        viewable: { type: boolean, description: 'false for quizzes and flashcards unless the write path is enabled' }
        progress: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        stats:
          description: "What the learner achieved, from Tala's stored row (read-only). Shape depends on `type`: video {rating}, quiz {correct, wrong, average, remarks}, flashcards {easy, medium, hard, notseen}; null when nothing is stored."
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                rating: { type: [number, 'null'] }
                correct: { type: integer }
                wrong: { type: integer }
                average: { type: [number, 'null'] }
                remarks: { type: [string, 'null'], enum: [PASSED, FAILED, null] }
                easy: { type: integer }
                medium: { type: integer }
                hard: { type: integer }
                notseen: { type: integer }
    TalaMaterial:
      type: object
      required: [id, type, name, description, thumbnail_url, file_url]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        file_url: { type: [string, 'null'], description: 'https address provided by Tala; access control of the file host is not verified' }
    MyModule:
      type: object
      required: [code, label, enabled, linked, status]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        enabled: { type: boolean }
        linked: { type: boolean }
        status:
          type: string
          enum: [disabled, not_linked, linked, needs_relink, revoked]
    TenantModule:
      type: object
      required: [code, label, entitled, enabled, external_team_id]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        entitled: { type: boolean, description: Platform has provisioned this module for the tenant. }
        enabled: { type: boolean }
        external_team_id: { type: [string, 'null'] }
    PlatformTenantModule:
      allOf:
        - $ref: '#/components/schemas/TenantModule'
        - type: object
          required: [links_count]
          properties:
            links_count: { type: integer, minimum: 0 }
    TenantDetail:
      type: object
      required: [id, code, name, status, settings]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        settings: { type: object, additionalProperties: true }
    TenantStatus:
      type: string
      enum: [provisioning, active, suspended, deactivated, archived]
    Tenant:
      type: object
      required: [id, code, name, status, created_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        activated_at: { type: [string, 'null'], format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    TenantPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }
    Membership:
      type: object
      required: [id, role, status, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        status: { type: string, enum: [invited, pending, active, suspended] }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Membership' }
    AuditEntry:
      type: object
      required: [id, actor_type, action, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        actor_type: { type: string, enum: [platform_admin, user, system] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        metadata: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }
    PlatformAdmin:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    PlatformAdminWithAbilities:
      allOf:
        - $ref: '#/components/schemas/PlatformAdmin'
        - type: object
          required: [abilities]
          properties:
            abilities:
              type: array
              items: { type: string }
    PageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array }
        links: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [current_page, per_page, total]
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
          additionalProperties: true
