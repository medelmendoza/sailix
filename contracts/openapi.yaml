openapi: 3.1.0
info:
  title: Sailix Platform API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Source of truth for /api/v1 (ADR-0006). Phase B covers authentication, `/me`, tenant administration
    core and platform administration. Business modules are added in Phase D.
    Tenant context is never an input: it is derived from the credential (docs/02 §6).
servers:
  - url: /api/v1
tags:
  - { name: auth, description: 'Login, logout, token rotation and invitations' }
  - { name: me, description: 'The authenticated principal' }
  - { name: tenant, description: "Tenant administration (caller's own tenant only)" }
  - { name: modules, description: 'Module gateways (Tala, read-only in the MVP)' }
  - { name: platform, description: 'Superadmin platform administration' }
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: loginToken
      summary: Mobile login. Returns a token bound to one membership, or a selection ticket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                device_name: { type: string, maxLength: 120 }
                agency_code: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: Token issued, or tenant selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TokenGrant'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutToken
      summary: Revoke the current token.
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/token/select:
    post:
      tags: [auth]
      operationId: selectToken
      summary: Complete mobile login after organization selection
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the token (old one is revoked). Refused after the absolute session limit.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/token/switch:
    post:
      tags: [auth]
      operationId: switchToken
      summary: Switch to another of the user's own active memberships (new token; old revoked).
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        '200':
          description: New token bound to the target membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/session:
    post:
      tags: [auth]
      operationId: loginSession
      summary: Web tenant-admin cookie login (call GET /sanctum/csrf-cookie first).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                agency_code: { type: [string, 'null'] }
      responses:
        '200':
          description: Session started, or membership selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SessionStarted'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutSession
      summary: Web logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session/select:
    post:
      tags: [auth]
      operationId: selectSession
      summary: Select session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionStarted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [auth]
      operationId: registerCrew
      summary: Self-register into an organization (pending admin activation)
      description: >
        Creates the account and a `pending` membership with role `crew` in the organization identified by
        `agency_code`. Role, status and tenant cannot be supplied. No token is issued; the member cannot sign in
        until a tenant admin activates the membership. The response is identical whether or not the email already
        has an account (an existing account is told by email instead; no enumeration of emails). An unknown or
        inactive agency code and an already-used username are reported as validation errors (accepted trade-off).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency_code, username, email, password, password_confirmation, first_name, last_name]
              properties:
                agency_code: { type: string, maxLength: 32 }
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                password_confirmation: { type: string }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: [string, 'null'], maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                suffix: { type: [string, 'null'], maxLength: 20 }
                mobile: { type: [string, 'null'], pattern: '^\+?[0-9 ()-]{7,20}$' }
      responses:
        '202':
          description: Registration received (identical for new and already-registered emails).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link by email
      description: Always answers 202, whether or not an active account exists for the email. The link is single-use and expires in 60 minutes. Tala passwords are never involved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: received }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes every token and session of the user. Invalid, expired, used or foreign tokens all answer `422 invalid_reset_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Account activated. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Authenticated user, membership, tenant, abilities and feature flags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: Requires the current password. Revokes all OTHER tokens and sessions of the user; the current one stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/deletion-request:
    post:
      tags: [me]
      operationId: requestAccountDeletion
      summary: Ask the organization to delete the caller's account
      description: >
        Records one open request per membership (repeating returns the same request) and notifies the organization's
        administrators. Deletion semantics and retention are pending decision Q-3: nothing is deleted or anonymized
        by this call and the member keeps access until an administrator acts.
      responses:
        '202':
          description: Request recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: Get tenant
      description: Requires ability `tenant.view`.
      responses:
        '200':
          description: Own tenant and resolved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateTenantSettings
      summary: Update tenant settings
      description: Requires ability `tenant.manage`. Unknown keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/users:
    get:
      tags: [tenant]
      operationId: listTenantUsers
      summary: List tenant users
      description: Requires `users.view`. Only the caller's tenant is ever returned.
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string } }
        - { name: 'filter[role]', in: query, schema: { type: string } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/users/{membership}:
    patch:
      tags: [tenant]
      operationId: updateTenantUser
      summary: Update tenant user
      description: Requires `users.manage`. A membership of another tenant answers 404.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [tenant_admin, crew] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/audit-logs:
    get:
      tags: [tenant]
      operationId: listTenantAuditLogs
      summary: List tenant audit logs
      description: Requires `audit.view`.
      parameters:
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries of the caller's tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/deletion-requests:
    get:
      tags: [tenant]
      operationId: listDeletionRequests
      summary: List pending account-deletion requests of the caller's organization
      description: Requires `users.manage`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of deletion requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequestPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules:
    get:
      tags: [tenant]
      operationId: listTenantModules
      summary: List modules and this organization's entitlement state
      description: Requires `tenant.view`. Lists every module in the registry.
      responses:
        '200':
          description: Module states for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules/{module}:
    put:
      tags: [tenant]
      operationId: setTenantModuleEnabled
      summary: Enable or disable a module for the caller's organization
      description: >
        Requires `module.<code>.manage`. Only toggles use of a module the platform has already
        provisioned (entitlement + team mapping). The team mapping can NOT be changed here. Disabling
        takes effect on the next gateway request.
      parameters:
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated module state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /modules/tala/link:
    get:
      tags: [modules]
      operationId: getTalaLink
      summary: State of the caller's Tala link
      description: >
        Requires the Tala module to be provisioned and enabled for the organization and `module.tala.use`.
        Never returns tokens, the Tala user id, team id or any credential.
      responses:
        '200':
          description: Link state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [modules]
      operationId: linkTalaAccount
      summary: Link the caller's existing Tala account
      description: >
        Verifies the credentials with Tala over HTTPS, requires the organization's mapped Tala team to be among the
        account's teams, then stores ONLY encrypted tokens (the password is never stored or logged). One Tala account
        can belong to one Sailix user; an account cannot be created here. Throttled.
        Error codes: `link_failed`, `team_not_in_organization`, `external_account_taken`, `different_account_linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [modules]
      operationId: unlinkTalaAccount
      summary: Remove the caller's Tala link and its stored tokens
      responses:
        '204': { description: Unlinked (idempotent). }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses:
    get:
      tags: [modules]
      operationId: listTalaCourses
      summary: The caller's assigned Tala courses (read-only)
      description: >
        The Tala user and team are taken from the stored link, never from the request. `409 not_linked` /
        `409 relink_required` when the link is missing or Tala rejected the stored token; `503 module_unavailable`
        when Tala cannot be reached. Material kinds excluded from the MVP (EPUB, legacy quizzes) are omitted.
      responses:
        '200':
          description: Courses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TalaCourse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}:
    get:
      tags: [modules]
      operationId: getTalaCourse
      summary: One assigned course with its materials and stored progress (read-only)
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Course detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaCourseDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/progress:
    post:
      tags: [modules]
      operationId: submitTalaProgress
      summary: Mark the caller's own video/PDF materials of a course as completed in Tala (write)
      description: >
        Disabled by default (`403 feature_disabled`; see `progress_submission` on the course). The payload sent to Tala is
        built on the server from Tala's own stored snapshot of this user; the client only names material ids. No score,
        comment or free text is accepted or forwarded. Completion never goes backwards. Quizzes are refused
        (`422 unsupported_material`). `409 progress_busy` when another update for the same link is running.
        Server-side replace/merge semantics of Tala's sync are UNVERIFIED (docs/13 section 20).
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaProgressResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /modules/tala/courses/{assignId}/materials/{materialId}:
    get:
      tags: [modules]
      operationId: getTalaMaterial
      summary: Metadata and file address of one video or PDF material of the caller's course
      description: >
        Quiz materials are never delivered (their payload contains the answer key; D-T8): `422 unsupported_material`.
        The material must belong to the caller's own course; the address is returned only when it is https.
      parameters:
        - { name: assignId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: materialId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: Material.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TalaMaterial' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /platform/auth/session:
    post:
      tags: [platform]
      operationId: loginPlatform
      summary: Superadmin login with mandatory TOTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, otp]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [platform]
      operationId: logoutPlatform
      summary: Logout platform
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/me:
    get:
      tags: [platform]
      operationId: getPlatformMe
      summary: Get platform me
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The signed-in superadmin.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdminWithAbilities' }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: List tenants
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [provisioning, active, suspended, deactivated, archived] } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: createTenant
      summary: Create tenant
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{2,32}$' }
                name: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Tenant created in `provisioning`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: getTenantById
      summary: Get tenant by id
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updateTenantName
      summary: Update tenant name
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/{action}:
    post:
      tags: [platform]
      operationId: transitionTenant
      summary: Lifecycle transition. Reason required for suspend, deactivate, archive. Revokes access when leaving `active`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, suspend, reactivate, deactivate, archive] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Tenant after the transition.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/admins:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listTenantAdmins
      summary: List tenant admins
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Page of tenant administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: inviteTenantAdmin
      summary: Invite tenant admin
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                username: { type: [string, 'null'], maxLength: 64 }
                display_name: { type: [string, 'null'], maxLength: 120 }
      responses:
        '201':
          description: Invitation created and emailed. `meta.invitation_token` is returned only in local/testing environments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
                  meta:
                    type: object
                    properties:
                      invitation_token: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listPlatformTenantModules
      summary: List module entitlements of a tenant
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Module states of the tenant, including link counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules/{module}:
    put:
      tags: [platform]
      operationId: provisionTenantModule
      summary: Grant a module to a tenant and map it to the external team
      description: >
        Platform-only. `external_team_id` binds the organization to exactly one team of the external
        system; it must be unique across all organizations. It cannot change while links exist
        (409 `links_exist`). A team already mapped to another organization is refused
        (409 `team_already_mapped`).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_team_id]
              properties:
                external_team_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                enabled: { type: boolean, default: false }
      responses:
        '200':
          description: Provisioned module.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/settings:
    get:
      tags: [platform]
      operationId: getPlatformSettings
      description: >
        Includes `tala_api_base_url` (platform-only; never tenant-configurable): an `https://` origin whose
        host is on the deployment allow-list (`SAILIX_TALA_ALLOWED_HOSTS`) and resolves only to public addresses.
      summary: Get platform settings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Platform settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformSettings
      summary: Update platform settings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/audit-logs:
    get:
      tags: [platform]
      operationId: listPlatformAuditLogs
      summary: List platform audit logs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[tenant_id]', in: query, schema: { type: string } }
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries (all tenants + platform).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile token bound to a membership (docs/04).
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA cookie session (web). Mutations require X-XSRF-TOKEN. Cookie name is configurable (SESSION_COOKIE).
  responses:
    Problem:
      description: RFC 9457 problem. `code` is a stable machine-readable identifier.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >
            unauthenticated, forbidden, not_found, validation, throttled, csrf_mismatch, invalid_credentials,
            invalid_ticket, invalid_invitation, invalid_transition, no_active_admin, last_admin, already_member,
            account_suspended, tenant_suspended, membership_suspended, membership_pending, web_access_denied,
            no_access, mfa_not_enrolled, tenant_mismatch, tenant_context_missing, invalid_agency_code, invalid_reset_token, invalid_current_password, module_disabled,
            module_forbidden, module_unavailable, module_not_provisioned, links_exist, team_already_mapped, server_error
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: [string, 'null'] }
    TenantRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    MembershipSummary:
      type: object
      required: [id, role, tenant]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        tenant:
          type: object
          required: [code, name]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
    TokenGrant:
      type: object
      required: [token, expires_at, membership]
      properties:
        token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        membership: { $ref: '#/components/schemas/MembershipSummary' }
    SelectionRequired:
      type: object
      required: [requires_tenant_selection, ticket, memberships]
      properties:
        requires_tenant_selection: { const: true }
        ticket: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    SessionStarted:
      type: object
      required: [membership, tenant]
      properties:
        membership:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string }
        tenant:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
    Me:
      type: object
      required: [user, membership, tenant, abilities, modules, memberships]
      properties:
        user:
          type: object
          required: [id, username, email]
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string }
            role: { type: string, enum: [tenant_admin, crew] }
            status: { type: string }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        abilities:
          type: array
          items: { type: string }
        modules:
          description: Modules this organization is entitled to AND this role may use, with the caller's link state.
          type: array
          items: { $ref: '#/components/schemas/MyModule' }
        memberships:
          description: >-
            Every organization the authenticated user can currently sign in to (active membership in an active
            organization), derived server-side from the credential. Used to offer organization switching via
            POST /auth/token/switch, which re-validates the choice.
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/MembershipSummary' }
              - type: object
                required: [current]
                properties:
                  current: { type: boolean }
    Profile:
      type: object
      description: Personal data held per organization (tenant-owned). Date of birth is deliberately not collected.
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        middle_name: { type: [string, 'null'] }
        last_name: { type: string }
        suffix: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
    DeletionRequest:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending] }
        requested_at: { type: string, format: date-time }
        membership:
          type: object
          properties:
            id: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                email: { type: string }
            profile:
              oneOf:
                - { $ref: '#/components/schemas/Profile' }
                - { type: 'null' }
    DeletionRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DeletionRequest' }
    ModuleCode:
      type: string
      enum: [tala]
      description: Module registry. Only `tala` exists in the MVP; new modules are added here.
    TalaLink:
      type: object
      required: [status, linked_at, last_verified_at]
      properties:
        status: { type: string, enum: [not_linked, linked, needs_relink, revoked] }
        linked_at: { type: [string, 'null'], format: date-time }
        last_verified_at: { type: [string, 'null'], format: date-time }
    TalaCourse:
      type: object
      required: [id, name, description, thumbnail_url, date_from, date_to, status, progress, total_materials]
      properties:
        id: { type: string, description: 'Assignment id (the only id the client ever uses)' }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        date_from: { type: [string, 'null'] }
        date_to: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        progress: { type: [string, 'null'], description: 'As reported by Tala; client-computed scores are self-reported (D-T8)' }
        total_materials: { type: integer }
    TalaCourseDetail:
      allOf:
        - { $ref: '#/components/schemas/TalaCourse' }
        - type: object
          required: [materials, hidden_materials, progress_submission]
          properties:
            progress_submission:
              type: boolean
              description: Whether this deployment lets the app submit completion to Tala.
            materials:
              type: array
              items: { $ref: '#/components/schemas/TalaMaterialSummary' }
            hidden_materials:
              type: integer
              description: Materials of kinds not supported in the MVP (EPUB, legacy quiz, unknown) that were left out.
    TalaProgressResult:
      type: object
      required: [progress, status, completed]
      properties:
        progress: { type: string, description: 'completed/total as stored after the submission' }
        status: { type: string }
        completed: { type: array, items: { type: string } }
    TalaMaterialSummary:
      type: object
      required: [id, type, name, description, thumbnail_url, viewable, progress, status]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf, quiz] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        viewable: { type: boolean, description: 'false for quizzes: not delivered in this version' }
        progress: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
    TalaMaterial:
      type: object
      required: [id, type, name, description, thumbnail_url, file_url]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, pdf] }
        name: { type: string }
        description: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        file_url: { type: [string, 'null'], description: 'https address provided by Tala; access control of the file host is not verified' }
    MyModule:
      type: object
      required: [code, label, enabled, linked, status]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        enabled: { type: boolean }
        linked: { type: boolean }
        status:
          type: string
          enum: [disabled, not_linked, linked, needs_relink, revoked]
    TenantModule:
      type: object
      required: [code, label, entitled, enabled, external_team_id]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        entitled: { type: boolean, description: Platform has provisioned this module for the tenant. }
        enabled: { type: boolean }
        external_team_id: { type: [string, 'null'] }
    PlatformTenantModule:
      allOf:
        - $ref: '#/components/schemas/TenantModule'
        - type: object
          required: [links_count]
          properties:
            links_count: { type: integer, minimum: 0 }
    TenantDetail:
      type: object
      required: [id, code, name, status, settings]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        settings: { type: object, additionalProperties: true }
    TenantStatus:
      type: string
      enum: [provisioning, active, suspended, deactivated, archived]
    Tenant:
      type: object
      required: [id, code, name, status, created_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        activated_at: { type: [string, 'null'], format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    TenantPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }
    Membership:
      type: object
      required: [id, role, status, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        status: { type: string, enum: [invited, pending, active, suspended] }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Membership' }
    AuditEntry:
      type: object
      required: [id, actor_type, action, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        actor_type: { type: string, enum: [platform_admin, user, system] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        metadata: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }
    PlatformAdmin:
