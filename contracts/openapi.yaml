        school: { type: [string, 'null'] }
        issued_on: { type: [string, 'null'], format: date }
        expires_on: { type: [string, 'null'], format: date }
        expiry_status: { type: string, enum: [none, valid, expiring, expired], description: 'Computed on the server.' }
        rejection_reason: { type: [string, 'null'], description: 'Only while rejected.' }
        file:
          type: object
          required: [name, type, size]
