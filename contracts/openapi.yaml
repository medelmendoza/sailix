        logo_url: { type: [string, 'null'], description: 'Public address of the logo image.' }
        favicon_url: { type: [string, 'null'] }
        login_logo_url: { type: [string, 'null'], description: 'Optional; the logo is used when empty.' }
        login_background_url: { type: [string, 'null'] }
        primary_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        secondary_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        accent_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        background_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        text_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        font_preset: { type: [string, 'null'], enum: [default, rounded, serif, system, modern, friendly, geometric, playful, elegant, classic, null] }
        dashboard_layout: { type: [string, 'null'], enum: [comfortable, compact, null] }
        version: { type: integer, description: 'Changes with every branding change; already part of the image addresses.' }
    PublicTenantEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicTenant' }
    BrandingEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicTenant' }
    BrandingInput:
      type: object
      properties:
        tagline: { type: [string, 'null'], maxLength: 120, description: 'Plain text.' }
        primary_color: { type: [string, 'null'], maxLength: 7, description: '#RRGGBB, contrast against white of at least 4.5:1.' }
        secondary_color: { type: [string, 'null'], maxLength: 7 }
        short_name: { type: [string, 'null'], maxLength: 40, description: 'Plain text.' }
        login_welcome_message: { type: [string, 'null'], maxLength: 200, description: 'Plain text.' }
        accent_color: { type: [string, 'null'], maxLength: 7, description: 'Contrast against white of at least 3:1.' }
        background_color: { type: [string, 'null'], maxLength: 7, description: 'The text colour must read on it (4.5:1); an unset side is the Sailix default.' }
        text_color: { type: [string, 'null'], maxLength: 7 }
        font_preset: { type: [string, 'null'], enum: [default, rounded, serif, system, modern, friendly, geometric, playful, elegant, classic, null], description: 'The first four are fonts every device has; the rest are web fonts fetched only when chosen.' }
        dashboard_layout: { type: [string, 'null'], enum: [comfortable, compact, null], description: 'How roomy the admin portal is; empty is comfortable.' }
    TenantDomain:
      type: object
      required: [id, domain, verified, verified_at, txt_name, txt_value, cname_target]
      properties:
        id: { type: string }
        domain: { type: string, description: 'Canonical form.' }
        verified: { type: boolean }
        verified_at: { type: [string, 'null'], format: date-time }
        txt_name: { type: string, description: 'The DNS TXT record to publish.' }
        txt_value: { type: [string, 'null'], description: 'Its value; null once verified.' }
        cname_target: { type: string, description: 'Where to point the domain once verified.' }
    DomainEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TenantDomain' }
    DomainList:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [default_address, slug, domains]
          properties:
            default_address: { type: string }
            slug: { type: string }
            domains:
              type: array
              items: { $ref: '#/components/schemas/TenantDomain' }
    TenantPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }
    Membership:
      type: object
      required: [id, role, status, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        status: { type: string, enum: [invited, pending, active, suspended] }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
    Crew:
      type: object
      required: [id, status, username, email, first_name, last_name]
      properties:
        id: { type: string, description: 'The membership id.' }
        status: { type: string, enum: [invited, pending, active, suspended] }
        username: { type: string }
        email: { type: string }
        first_name: { type: [string, 'null'] }
        middle_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        suffix: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
        crew_number: { type: [string, 'null'] }
        rank: { type: [string, 'null'] }
        fleet: { type: [string, 'null'] }
        vessel: { type: [string, 'null'] }
        employment_status: { type: [string, 'null'] }
        date_arrive: { type: [string, 'null'], format: date }
        date_depart: { type: [string, 'null'], format: date }
        birthday: { type: [string, 'null'], format: date, description: 'Only in the single-member view.' }
    DocumentRequestItem:
      type: object
      required: [type, requested_at]
      properties:
        type:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            short_name: { type: [string, 'null'] }
        requested_at: { type: [string, 'null'], format: date-time }
    CrewDocumentRow:
      type: object
      required: [type, document, state, requested]
      properties:
        type:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            short_name: { type: [string, 'null'] }
        document:
          oneOf:
            - type: object
              required: [id, review_status]
              properties:
                id: { type: string }
                number: { type: [string, 'null'] }
                expires_on: { type: [string, 'null'], format: date }
                review_status: { type: string, enum: [pending, approved, rejected] }
            - { type: 'null' }
        state: { type: string, enum: [missing, pending, rejected, none, valid, expiring, expired] }
        requested: { type: boolean }
    CrewDocumentRequested:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [requested]
          properties:
            requested: { type: boolean }
    CrewUpdate:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        middle_name: { type: [string, 'null'], maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        suffix: { type: [string, 'null'], maxLength: 20 }
        mobile: { type: [string, 'null'], maxLength: 20 }
        crew_number: { type: [string, 'null'], maxLength: 30 }
        rank: { type: [string, 'null'], maxLength: 60 }
        fleet: { type: [string, 'null'], maxLength: 100 }
        vessel: { type: [string, 'null'], maxLength: 100 }
        employment_status: { type: [string, 'null'], maxLength: 60 }
        date_arrive: { type: [string, 'null'], format: date }
        date_depart: { type: [string, 'null'], format: date }
        birthday: { type: [string, 'null'], format: date }
    CrewPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Crew' }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Membership' }
    AuditEntry:
      type: object
      required: [id, actor_type, action, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        actor_type: { type: string, enum: [platform_admin, user, system] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        metadata: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }
    PlatformAdmin:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    PlatformAdminWithAbilities:
      allOf:
        - $ref: '#/components/schemas/PlatformAdmin'
        - type: object
          required: [abilities]
          properties:
            abilities:
              type: array
              items: { type: string }
    PageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array }
        links: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [current_page, per_page, total]
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
          additionalProperties: true
