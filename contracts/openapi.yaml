    CrewDocument:
      type: object
      required: [id, status, type, number, grade, location, school, issued_on, expires_on, expiry_status, rejection_reason, file, submitted_at, reviewed_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        type: { $ref: '#/components/schemas/DocumentType' }
        number: { type: [string, 'null'] }
        grade: { type: [string, 'null'] }
