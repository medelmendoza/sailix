        location: { type: [string, 'null'] }
        location_other: { type: [string, 'null'] }
        vessel: { type: [string, 'null'] }
        details: { type: [string, 'null'], description: 'Plain text; show it as text, never as HTML.' }
        intervened: { type: boolean }
        intervention_details: { type: [string, 'null'] }
        official_report: { type: boolean }
        file:
          type: [object, 'null']
          required: [name, type, size]
