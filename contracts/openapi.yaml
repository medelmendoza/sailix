openapi: 3.1.0
info:
  title: Sailix Platform API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Source of truth for /api/v1 (ADR-0006). Phase B covers authentication, `/me`, tenant administration
    core and platform administration. Business modules are added in Phase D.
    Tenant context is never an input: it is derived from the credential (docs/02 §6).
servers:
  - url: /api/v1
tags:
  - { name: auth, description: 'Login, logout, token rotation and invitations' }
  - { name: me, description: 'The authenticated principal' }
  - { name: tenant, description: "Tenant administration (caller's own tenant only)" }
  - { name: platform, description: 'Superadmin platform administration' }
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: loginToken
      summary: Mobile login. Returns a token bound to one membership, or a selection ticket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
                device_name: { type: string, maxLength: 120 }
                agency_code: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: Token issued, or tenant selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TokenGrant'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutToken
      summary: Revoke the current token.
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/token/select:
    post:
      tags: [auth]
      operationId: selectToken
      summary: Complete mobile login after organization selection
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the token (old one is revoked). Refused after the absolute session limit.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/token/switch:
    post:
      tags: [auth]
      operationId: switchToken
      summary: Switch to another of the user's own active memberships (new token; old revoked).
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        '200':
          description: New token bound to the target membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/session:
    post:
      tags: [auth]
      operationId: loginSession
      summary: Web tenant-admin cookie login (call GET /sanctum/csrf-cookie first).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                agency_code: { type: [string, 'null'] }
      responses:
        '200':
          description: Session started, or membership selection required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SessionStarted'
                      - $ref: '#/components/schemas/SelectionRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: logoutSession
      summary: Web logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session/select:
    post:
      tags: [auth]
      operationId: selectSession
      summary: Select session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, membership_id]
              properties:
                ticket: { type: string }
                membership_id: { type: string }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionStarted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204': { description: Account activated. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Authenticated user, membership, tenant, abilities and feature flags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: Get tenant
      description: Requires ability `tenant.view`.
      responses:
        '200':
          description: Own tenant and resolved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tenant]
      operationId: updateTenantSettings
      summary: Update tenant settings
      description: Requires ability `tenant.manage`. Unknown keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/users:
    get:
      tags: [tenant]
      operationId: listTenantUsers
      summary: List tenant users
      description: Requires `users.view`. Only the caller's tenant is ever returned.
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string } }
        - { name: 'filter[role]', in: query, schema: { type: string } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/users/{membership}:
    patch:
      tags: [tenant]
      operationId: updateTenantUser
      summary: Update tenant user
      description: Requires `users.manage`. A membership of another tenant answers 404.
      parameters:
        - { name: membership, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [tenant_admin, crew] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /tenant/audit-logs:
    get:
      tags: [tenant]
      operationId: listTenantAuditLogs
      summary: List tenant audit logs
      description: Requires `audit.view`.
      parameters:
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries of the caller's tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules:
    get:
      tags: [tenant]
      operationId: listTenantModules
      summary: List modules and this organization's entitlement state
      description: Requires `tenant.view`. Lists every module in the registry.
      responses:
        '200':
          description: Module states for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tenant/modules/{module}:
    put:
      tags: [tenant]
      operationId: setTenantModuleEnabled
      summary: Enable or disable a module for the caller's organization
      description: >
        Requires `module.<code>.manage`. Only toggles use of a module the platform has already
        provisioned (entitlement + team mapping). The team mapping can NOT be changed here. Disabling
        takes effect on the next gateway request.
      parameters:
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated module state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/auth/session:
    post:
      tags: [platform]
      operationId: loginPlatform
      summary: Superadmin login with mandatory TOTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, otp]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [platform]
      operationId: logoutPlatform
      summary: Logout platform
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/me:
    get:
      tags: [platform]
      operationId: getPlatformMe
      summary: Get platform me
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The signed-in superadmin.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformAdminWithAbilities' }
        '401': { $ref: '#/components/responses/Problem' }
  /platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: List tenants
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [provisioning, active, suspended, deactivated, archived] } }
        - { name: 'filter[q]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: createTenant
      summary: Create tenant
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{2,32}$' }
                name: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Tenant created in `provisioning`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: getTenantById
      summary: Get tenant by id
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updateTenantName
      summary: Update tenant name
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/{action}:
    post:
      tags: [platform]
      operationId: transitionTenant
      summary: Lifecycle transition. Reason required for suspend, deactivate, archive. Revokes access when leaving `active`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, suspend, reactivate, deactivate, archive] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Tenant after the transition.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/admins:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listTenantAdmins
      summary: List tenant admins
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Page of tenant administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [platform]
      operationId: inviteTenantAdmin
      summary: Invite tenant admin
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                username: { type: [string, 'null'], maxLength: 64 }
                display_name: { type: [string, 'null'], maxLength: 120 }
      responses:
        '201':
          description: Invitation created and emailed. `meta.invitation_token` is returned only in local/testing environments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
                  meta:
                    type: object
                    properties:
                      invitation_token: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      tags: [platform]
      operationId: listPlatformTenantModules
      summary: List module entitlements of a tenant
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Module states of the tenant, including link counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /platform/tenants/{tenant}/modules/{module}:
    put:
      tags: [platform]
      operationId: provisionTenantModule
      summary: Grant a module to a tenant and map it to the external team
      description: >
        Platform-only. `external_team_id` binds the organization to exactly one team of the external
        system; it must be unique across all organizations. It cannot change while links exist
        (409 `links_exist`). A team already mapped to another organization is refused
        (409 `team_already_mapped`).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ModuleCode' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_team_id]
              properties:
                external_team_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                enabled: { type: boolean, default: false }
      responses:
        '200':
          description: Provisioned module.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlatformTenantModule' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/settings:
    get:
      tags: [platform]
      operationId: getPlatformSettings
      description: >
        Includes `tala_api_base_url` (platform-only; never tenant-configurable): an `https://` origin whose
        host is on the deployment allow-list (`SAILIX_TALA_ALLOWED_HOSTS`) and resolves only to public addresses.
      summary: Get platform settings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Platform settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [platform]
      operationId: updatePlatformSettings
      summary: Update platform settings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /platform/audit-logs:
    get:
      tags: [platform]
      operationId: listPlatformAuditLogs
      summary: List platform audit logs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: 'filter[tenant_id]', in: query, schema: { type: string } }
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of audit entries (all tenants + platform).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Mobile token bound to a membership (docs/04).
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA cookie session (web). Mutations require X-XSRF-TOKEN. Cookie name is configurable (SESSION_COOKIE).
  responses:
    Problem:
      description: RFC 9457 problem. `code` is a stable machine-readable identifier.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >
            unauthenticated, forbidden, not_found, validation, throttled, csrf_mismatch, invalid_credentials,
            invalid_ticket, invalid_invitation, invalid_transition, no_active_admin, last_admin, already_member,
            account_suspended, tenant_suspended, membership_suspended, membership_pending, web_access_denied,
            no_access, mfa_not_enrolled, tenant_mismatch, tenant_context_missing, module_disabled,
            module_forbidden, module_unavailable, module_not_provisioned, links_exist, team_already_mapped, server_error
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: [string, 'null'] }
    TenantRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    MembershipSummary:
      type: object
      required: [id, role, tenant]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        tenant:
          type: object
          required: [code, name]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
    TokenGrant:
      type: object
      required: [token, expires_at, membership]
      properties:
        token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        membership: { $ref: '#/components/schemas/MembershipSummary' }
    SelectionRequired:
      type: object
      required: [requires_tenant_selection, ticket, memberships]
      properties:
        requires_tenant_selection: { const: true }
        ticket: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    SessionStarted:
      type: object
      required: [membership, tenant]
      properties:
        membership:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string }
        tenant:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
    Me:
      type: object
      required: [user, membership, tenant, abilities, modules]
      properties:
        user:
          type: object
          required: [id, username, email]
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string }
            role: { type: string, enum: [tenant_admin, crew] }
            status: { type: string }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        abilities:
          type: array
          items: { type: string }
        modules:
          description: Modules this organization is entitled to AND this role may use, with the caller's link state.
          type: array
          items: { $ref: '#/components/schemas/MyModule' }
    ModuleCode:
      type: string
      enum: [tala]
      description: Module registry. Only `tala` exists in the MVP; new modules are added here.
    MyModule:
      type: object
      required: [code, label, enabled, linked, status]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        enabled: { type: boolean }
        linked: { type: boolean }
        status:
          type: string
          enum: [disabled, not_linked, linked, needs_relink, revoked]
    TenantModule:
      type: object
      required: [code, label, entitled, enabled, external_team_id]
      properties:
        code: { $ref: '#/components/schemas/ModuleCode' }
        label: { type: string }
        entitled: { type: boolean, description: Platform has provisioned this module for the tenant. }
        enabled: { type: boolean }
        external_team_id: { type: [string, 'null'] }
    PlatformTenantModule:
      allOf:
        - $ref: '#/components/schemas/TenantModule'
        - type: object
          required: [links_count]
          properties:
            links_count: { type: integer, minimum: 0 }
    TenantDetail:
      type: object
      required: [id, code, name, status, settings]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        settings: { type: object, additionalProperties: true }
    TenantStatus:
      type: string
      enum: [provisioning, active, suspended, deactivated, archived]
    Tenant:
      type: object
      required: [id, code, name, status, created_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        activated_at: { type: [string, 'null'], format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    TenantPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }
    Membership:
      type: object
      required: [id, role, status, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [tenant_admin, crew] }
        status: { type: string, enum: [invited, pending, active, suspended] }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Membership' }
    AuditEntry:
      type: object
      required: [id, actor_type, action, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        actor_type: { type: string, enum: [platform_admin, user, system] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        metadata: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }
    PlatformAdmin:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    PlatformAdminWithAbilities:
      allOf:
        - $ref: '#/components/schemas/PlatformAdmin'
        - type: object
          required: [abilities]
          properties:
            abilities:
              type: array
              items: { type: string }
    PageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array }
        links: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [current_page, per_page, total]
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
          additionalProperties: true
